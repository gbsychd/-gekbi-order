<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隔壁宵夜彰化店｜訂單狀態</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;text-align:center;padding:28px 16px}
header h1{margin:0;font-size:30px;font-weight:800}
header p{margin:8px 0 0;color:#ccc;font-size:16px}
.container{max-width:760px;margin:auto;padding:16px 16px 150px}
.notice,.cart{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.notice{margin-bottom:24px;text-align:center;font-size:17px;line-height:1.8}
.notice-title{font-size:23px;font-weight:800}.address{color:#777;font-size:14px;margin-top:6px}
.pickup-notice{margin-top:12px;padding:12px;border-radius:10px;background:#fff4e8;color:#c84f00;font-size:15px;font-weight:700;line-height:1.6}
.category{font-size:24px;font-weight:800;margin:30px 2px 12px}
.item{background:#fff;border-radius:16px;padding:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
.item-info{flex:1;min-width:0}.item-name{font-size:18px;font-weight:700;line-height:1.5}.price{margin-top:5px;font-size:19px;color:#d35400;font-weight:800}
.add-btn{border:0;background:#111;color:#fff;border-radius:12px;padding:12px 17px;font-size:16px;min-width:76px;cursor:pointer}.add-btn:active{transform:scale(.96)}
.menu-card{cursor:pointer;user-select:none;touch-action:manipulation};position:relative}.sold-out-item{opacity:.58;cursor:not-allowed}.sold-badge{display:inline-flex;align-items:center;justify-content:center;background:#777;color:#fff;border-radius:8px;padding:5px 9px;font-size:14px;font-weight:800;white-space:nowrap}.menu-card:active{transform:scale(.99)}
.category-toggle{display:flex;align-items:center;justify-content:space-between;background:#111;color:#fff;border-radius:13px;padding:15px 17px;margin:16px 0 8px;font-size:18px;font-weight:800;cursor:pointer;user-select:none;position:sticky;top:0;z-index:50}
.category-toggle:active{transform:scale(.99)}
.category-arrow{font-size:14px;transition:transform .2s ease}
.category-toggle.category-open .category-arrow{transform:rotate(180deg)}
.category-items{display:none}
.category-items.category-open{display:block}
.category-items .item{margin-bottom:8px}
.category-selector-wrap{position:sticky;top:0;z-index:80;display:flex;gap:8px;overflow-x:auto;background:#f5f5f5;padding:12px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}
.category-selector-wrap::-webkit-scrollbar{display:none}
.category-selector-btn{flex:0 0 auto;border:0;border-radius:12px;background:#111;color:#fff;padding:13px 16px;font-size:16px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.13);scroll-snap-align:center}
.category-selector-btn.active{background:#d35400}
.hidden-subtitle{margin:0 0 10px;padding:8px 4px;color:#777;font-size:14px}
.browse-price{font-size:22px;color:#d35400;font-weight:800;margin:-5px 0 14px}.browse-description{padding:12px;background:#f7f7f7;border-radius:10px;color:#777;margin-bottom:14px}.quantity-direct{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px}.quantity-label{font-weight:800}.quantity-controls{display:flex;align-items:center;gap:14px}.quantity-controls button{width:38px;height:38px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:22px;font-weight:800;cursor:pointer}.quantity-controls span{min-width:24px;text-align:center;font-size:18px;font-weight:800}
.inline-option-box{background:#fff;border-radius:15px;padding:17px;margin:-3px 0 14px;border:2px solid #eee;box-shadow:0 3px 12px rgba(0,0,0,.08)}
.option-title{font-size:18px;font-weight:800;margin-bottom:14px}.option-group{margin-bottom:16px}.option-group-title{font-size:16px;font-weight:700;margin-bottom:9px}.option-list{display:flex;flex-wrap:wrap;gap:8px}
.option-btn{border:1px solid #ddd;background:#fff;color:#222;border-radius:10px;padding:10px 12px;font-size:15px;cursor:pointer}.option-btn.selected{background:#111;color:#fff;border-color:#111}.option-price{color:#d35400;font-weight:700}.option-btn.selected .option-price{color:#fff}.option-btn.sold-out-option{background:#f3f3f3;color:#888;border-color:#ddd;cursor:not-allowed;opacity:1}.option-btn.sold-out-option .option-sold-label{display:block;margin-top:3px;font-size:12px;font-weight:800;color:#fff;background:#777;border-radius:5px;padding:2px 5px}.option-btn.sold-out-option .option-price{color:#888}
.confirm-option,.submit-btn{width:100%;border:0;background:#d35400;color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:800;margin-top:5px}.cancel-option{width:100%;border:1px solid #ddd;background:#fff;color:#555;border-radius:12px;padding:12px;font-size:16px;margin-top:8px}
.hidden-title{margin-top:42px;background:#111;color:#fff;padding:15px;border-radius:14px;font-size:23px;font-weight:800;text-align:center}.hidden-subtitle{text-align:center;color:#777;font-size:14px;margin:8px 0 15px}
.cart{margin-top:35px}.cart h2{margin:0 0 15px;font-size:25px}.cart-row{padding:14px 0;border-bottom:1px solid #eee}.cart-main{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.cart-name{font-weight:700;font-size:16px;line-height:1.5}.cart-price{font-weight:700;white-space:nowrap}.cart-options{color:#777;font-size:13px;margin-top:5px;line-height:1.6}.cart-controls{margin-top:9px;display:flex;justify-content:flex-end;align-items:center;gap:7px}.cart-controls button{border:0;background:#eee;font-size:15px;padding:7px 10px;border-radius:7px}.total{text-align:right;font-size:23px;font-weight:800;margin:20px 0}
.order-form label{display:block;margin:15px 0 0;font-size:16px;font-weight:600}input,select{width:100%;padding:14px;margin-top:7px;border:1px solid #ddd;border-radius:11px;font-size:16px;background:#fff}.submit-btn{padding:16px;font-size:18px;margin-top:18px}.success{display:none;margin-top:15px;padding:15px;border-radius:12px;background:#eaf8ed;color:#217a35;line-height:1.7}
.bottom-cart{position:fixed;left:12px;right:12px;bottom:12px;background:#111;color:#fff;padding:15px 18px;border-radius:17px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 5px 20px rgba(0,0,0,.25);z-index:100}.bottom-cart button{border:0;background:#d35400;color:#fff;padding:12px 18px;border-radius:11px;font-size:16px;font-weight:700}
@media(max-width:480px){header h1{font-size:28px}.item-name{font-size:17px}.add-btn{min-width:72px;padding:11px 13px}.category{font-size:23px}}

.order-closed{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:9999}
.order-closed-card{width:min(520px,100%);background:#fff;border-radius:20px;padding:30px 24px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.order-closed-card h2{margin:0 0 12px;font-size:25px}.order-closed-card p{margin:8px 0;line-height:1.7;color:#555}
.order-closed-time{font-size:19px;font-weight:800;color:#d35400;margin:16px 0}
.closed-confirm-btn{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:800;margin-top:10px;cursor:pointer}
.ordering-hours-card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:7px 10px;margin:6px 0 8px;text-align:center;box-shadow:none}
.hours-title{font-size:17px;font-weight:900;margin-bottom:2px}
.hours-time{font-size:18px;font-weight:900;letter-spacing:.2px;line-height:1.2}
.hours-note{font-size:11px;color:#666;margin-top:1px}

/* 手機版頂部資訊緊湊化 */
.shop-title{font-size:19px!important;margin:6px auto 3px!important;line-height:1.15!important;max-width:260px}
.subtitle{font-size:14px!important;margin:2px 0 6px!important}

@media(max-width:600px){
  .container{padding-left:10px!important;padding-right:10px!important}
  .shop-title{font-size:20px!important}
  .subtitle{font-size:13px!important}
}

@media(max-width:600px){}

.cutlery-choice{display:flex;gap:14px;margin:4px 0 12px}
.cutlery-choice label{display:flex;align-items:center;gap:5px;font-weight:600}
.cutlery-choice input{margin:0}

.fixed-option{pointer-events:none!important;cursor:default!important;opacity:1!important}
.fixed-option{pointer-events:none!important;cursor:default!important;opacity:1!important}
.input-error{border:2px solid #d00!important;background:#fff1f1!important;box-shadow:0 0 0 2px rgba(208,0,0,.08)!important}
.input-error::placeholder{color:#d00!important}

.order-confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px}
.order-confirm-dialog{width:min(92vw,480px);max-height:82vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 15px 45px rgba(0,0,0,.25)}
.order-confirm-title{text-align:center;font-size:21px;font-weight:900;margin-bottom:7px}
.order-confirm-warm{text-align:center;font-size:13px;color:#777;background:#faf6ee;border-radius:10px;padding:9px 10px;margin-bottom:12px;line-height:1.45}
.order-confirm-list{border-top:1px solid #eee}
.confirm-item{padding:10px 0;border-bottom:1px solid #eee}
.confirm-item-main{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:15px}
.confirm-item-main strong{font-weight:800}
.confirm-item-main b{min-width:58px;text-align:right}
.confirm-item-options{font-size:12px;color:#777;margin-top:4px;line-height:1.45}
.confirm-total{text-align:right;font-size:20px;font-weight:900;padding:13px 0 4px}
.order-confirm-actions{display:flex;gap:10px;margin-top:14px}
.order-confirm-actions button{flex:1;border:0;border-radius:11px;padding:12px 8px;font-size:16px;font-weight:900;cursor:pointer}
.order-confirm-continue{background:#eee;color:#333}
.order-confirm-submit{background:#222;color:#fff}

/* 購物車資訊更緊湊 */
.cart-row{padding:7px 0!important;margin:0!important}
.cart-main{gap:5px!important}
.cart-name{line-height:1.25!important;margin:0!important}
.cart-options{margin-top:2px!important;line-height:1.3!important;font-size:12px!important}
.cart-controls{margin-top:5px!important;gap:5px!important}
.cart-controls button{padding:5px 9px!important}

.cart-row{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:7px!important;padding:6px 0!important}
.cart-main{min-width:0!important;flex:1!important}
.cart-name{font-size:14px!important;line-height:1.2!important}
.cart-options{font-size:11px!important;line-height:1.25!important;margin-top:2px!important}
.cart-actions-inline{display:flex!important;align-items:center!important;gap:3px!important;white-space:nowrap!important}
.cart-actions-inline button{padding:3px 7px!important;min-width:26px!important;height:27px!important}
.cart-qty{min-width:15px;text-align:center;font-size:13px}
.cart-actions-inline .cart-price{font-weight:800!important;min-width:48px;text-align:right;font-size:14px!important}
.cart-actions-inline .cart-delete{padding:3px 6px!important;font-size:12px!important}
.cart-controls{display:none!important}
@media(max-width:600px){
  .cart-actions-inline{gap:2px!important}
  .cart-actions-inline .cart-price{min-width:44px!important}
  .cart-actions-inline button{padding:3px 6px!important}
}

/* 菜單品項：名稱與價格同列，價格固定靠最右側 */
.item-info{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:10px!important;width:100%!important}
.item-name{flex:1!important;min-width:0!important}
.item-price{margin-left:auto!important;white-space:nowrap!important;text-align:right!important}

/* 底部「已選 X 項／結帳」縮小版 */
.bottom-cart{padding:6px 10px!important;min-height:40px!important;height:40px!important;box-sizing:border-box!important}
.bottom-cart button{padding:6px 14px!important;font-size:14px!important;line-height:1.1!important}
.bottom-cart div{font-size:14px!important;line-height:1.1!important}

/* 底部結帳列往上移，避免 iPhone Safari 底部操作區誤觸 */
.bottom-cart{
  bottom:12px!important;
  margin-bottom:env(safe-area-inset-bottom, 0px)!important;
}

.non-ordering-close{position:absolute;right:12px;top:10px;width:34px;height:34px;border:0;border-radius:50%;background:#111;color:#fff;font-size:22px;line-height:34px;cursor:pointer;z-index:10;}
"".checkout-total-strong{font-weight:900}.order-success-detail{font-weight:700}
.ordering-closed-banner{position:sticky;top:0;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff4e8;border-bottom:1px solid #ffd5ad;padding:10px 14px;color:#8f4300;font-size:14px}
.ordering-closed-banner>div{display:flex;flex-direction:column;gap:2px}.ordering-closed-banner strong{font-size:16px}.ordering-closed-banner span{font-size:12px;color:#8a6b55}
.ordering-closed-banner button{border:0;background:#111;color:#fff;width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;flex:0 0 auto}
.bottom-cart-info{display:flex;align-items:center;gap:14px}.bottom-cart-info strong{font-size:17px}
.success-title{font-size:22px;font-weight:900;margin-bottom:14px}

/* ===== 訂單狀態頁：質感版面（僅視覺，不改既有內容/邏輯） ===== */
body.customer-order-status-mode{
  background:
    radial-gradient(circle at 50% 18%, rgba(255,158,27,.10), transparent 34%),
    linear-gradient(180deg,#080a0b 0%,#0d1012 52%,#090b0c 100%) !important;
  color:#f5f5f5;
}
body.customer-order-status-mode .container{
  max-width:780px !important;
  min-height:calc(100vh - 88px) !important;
  padding:24px 14px 44px !important;
}
body.customer-order-status-mode .container > *:not(#successMessage){
  display:none!important;
}
body.customer-order-status-mode #successMessage{
  position:relative;
  overflow:hidden;
  display:block!important;
  margin:0 auto!important;
  padding:30px 20px 24px!important;
  border:1px solid rgba(255,169,47,.52)!important;
  border-radius:24px!important;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,160,24,.11),transparent 30%),
    linear-gradient(145deg,#15191b,#0e1113)!important;
  box-shadow:
    0 24px 70px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.035)!important;
  color:#f5f5f5!important;
}
body.customer-order-status-mode #successMessage::before{
  content:"";
  position:absolute;
  left:18%;
  right:18%;
  top:-1px;
  height:2px;
  background:linear-gradient(90deg,transparent,#ffad32,transparent);
  box-shadow:0 0 22px rgba(255,167,35,.7);
}
body.customer-order-status-mode #successMessage::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  left:50%;
  top:42px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,158,27,.10),transparent 68%);
  pointer-events:none;
}
body.customer-order-status-mode #successMessage .success-title{
  position:relative;
  z-index:1;
  margin:0 0 24px!important;
  padding:4px 0 8px;
  text-align:center!important;
  font-size:30px!important;
  line-height:1.25;
  font-weight:900!important;
  color:#ffb23e!important;
  letter-spacing:.02em;
  text-shadow:0 0 20px rgba(255,168,39,.18);
}
body.customer-order-status-mode .success-grid{
  position:relative;
  z-index:1;
  display:grid!important;
  grid-template-columns:1fr 1fr!important;
  gap:10px!important;
  margin:0!important;
  padding:0!important;
}
body.customer-order-status-mode .success-grid>div{
  min-height:82px;
  box-sizing:border-box;
  padding:16px 15px!important;
  border:1px solid rgba(255,255,255,.045);
  border-radius:15px!important;
  background:linear-gradient(145deg,#1a1f22,#14181a)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
}
body.customer-order-status-mode .success-grid span{
  margin-bottom:7px!important;
  color:#8e969b!important;
  font-size:14px!important;
  letter-spacing:.03em;
}
body.customer-order-status-mode .success-grid strong{
  display:block;
  color:#fff!important;
  font-size:22px!important;
  line-height:1.25;
  font-weight:900!important;
}
body.customer-order-status-mode #successStatus{
  color:#ffb23e!important;
}
body.customer-order-status-mode #successCustomer{
  position:relative;
  z-index:1;
  margin-top:10px!important;
  padding:16px 17px!important;
  border:1px solid rgba(255,255,255,.045);
  border-radius:15px!important;
  background:#151a1d!important;
  color:#f0f0f0!important;
  font-size:17px;
  line-height:1.55;
  font-weight:700;
}
body.customer-order-status-mode #customerStatusNote{
  position:relative;
  z-index:1;
  margin-top:14px!important;
  padding:17px!important;
  border-radius:15px!important;
  border:1px solid rgba(255,170,45,.16);
  background:rgba(255,160,24,.055)!important;
  color:#ffb23e!important;
  font-size:16px;
  line-height:1.65;
  text-align:center;
}
body.customer-order-status-mode .customer-making-animation{
  position:relative;
  z-index:2;
  margin:14px 0 0;
  padding:28px 12px 24px!important;
  border-radius:17px;
  border:1px solid rgba(255,169,47,.24);
  background:
    radial-gradient(circle at 50% 35%,rgba(255,159,24,.14),transparent 45%),
    #14191b;
  gap:16px!important;
}
body.customer-order-status-mode .customer-making-animation strong{
  color:#ffb23e;
  font-size:20px;
  font-weight:900;
  letter-spacing:.04em;
}
body.customer-order-status-mode .customer-making-dots{
  position:relative;
  width:96px;
  height:48px;
  gap:0!important;
}
body.customer-order-status-mode .customer-making-dots::before{
  content:"";
  position:absolute;
  inset:2px 20px;
  border:2px solid rgba(255,177,59,.28);
  border-top-color:#ffae2e;
  border-radius:50%;
  animation:customerCookingRing 1.7s linear infinite;
}
body.customer-order-status-mode .customer-making-dots span{
  position:absolute;
  width:10px!important;
  height:10px!important;
  top:19px;
  background:#ffae2e!important;
  box-shadow:0 0 14px rgba(255,168,39,.8);
}
body.customer-order-status-mode .customer-making-dots span:nth-child(1){
  left:24px;
  animation:customerCookingPulse 1.2s infinite ease-in-out;
}
body.customer-order-status-mode .customer-making-dots span:nth-child(2){
  left:43px;
  animation:customerCookingPulse 1.2s .18s infinite ease-in-out;
}
body.customer-order-status-mode .customer-making-dots span:nth-child(3){
  left:62px;
  animation:customerCookingPulse 1.2s .36s infinite ease-in-out;
}
@keyframes customerCookingRing{
  to{transform:rotate(360deg)}
}
@keyframes customerCookingPulse{
  0%,100%{transform:translateY(7px) scale(.55);opacity:.35}
  50%{transform:translateY(-7px) scale(1);opacity:1}
}
@media(max-width:480px){
  body.customer-order-status-mode .container{
    padding:18px 12px 32px!important;
  }
  body.customer-order-status-mode #successMessage{
    padding:26px 14px 20px!important;
    border-radius:22px!important;
  }
  body.customer-order-status-mode #successMessage .success-title{
    font-size:27px!important;
  }
  body.customer-order-status-mode .success-grid{
    gap:8px!important;
  }
  body.customer-order-status-mode .success-grid>div{
    min-height:78px;
    padding:14px 12px!important;
  }
  body.customer-order-status-mode .success-grid strong{
    font-size:20px!important;
  }
}

/* 送出訂單後，同一個點餐頁切換成訂單狀態頁，不開新分頁 */
body.customer-order-status-mode .ordering-hours-card,
body.customer-order-status-mode #orderingClosedBanner,
body.customer-order-status-mode .bottom-cart{
  display:none!important;
}
body.customer-order-status-mode .container{
  max-width:760px;
  min-height:calc(100vh - 88px);
  padding:28px 16px 40px;
}
body.customer-order-status-mode .container > *:not(#successMessage){
  display:none!important;
}
body.customer-order-status-mode #successMessage{
  display:block!important;
  margin:0;
  padding:28px 22px;
  background:#fff;
  border-radius:20px;
  box-shadow:0 2px 14px rgba(0,0,0,.08);
}
body.customer-order-status-mode #successMessage .success-title{
  font-size:30px;
  text-align:center;
  margin-bottom:22px;
}
.customer-making-animation{
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:34px 10px 20px;
  text-align:center;
}
.customer-making-animation.active{display:flex!important}
.customer-making-dots{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:center;
}
.customer-making-dots span{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#999;
  animation:customerMakingDot 1.2s infinite ease-in-out;

<script>
const SUPABASE_URL = "https://xoyxtgqamzdxbboxhcdu.supabase.co";
const SUPABASE_KEY = "sb_publishable_tMYuq4stsYyHJaTuF-LMrg_hUmOXuB5";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function pad2(n){return String(n).padStart(2,'0')}
function getTaipeiNow(){
  const parts=new Intl.DateTimeFormat('en-US',{
    timeZone:'Asia/Taipei',hour12:false,year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'
  }).formatToParts(new Date());
  const get=k=>Number(parts.find(p=>p.type===k)?.value||0);
  return {year:get('year'),month:get('month'),day:get('day'),hour:get('hour'),minute:get('minute'),second:get('second')};
}

/* 獨立狀態頁：依頁面本身固定指定單／不指定單主題，不讓另一種頁面覆蓋顏色。 */
const STATUS_PAGE_RESERVED = document.body.getAttribute('data-status-page') === 'reserved';
function enterCustomerOrderStatusMode(orderId){
  document.body.classList.add('customer-order-status-mode');
  document.body.classList.toggle('reserved-order-mode', STATUS_PAGE_RESERVED);
  document.body.setAttribute('data-reserved-order', STATUS_PAGE_RESERVED ? '1' : '0');
  const timeline=document.getElementById('orderStatusTimeline');
  if(timeline){
    timeline.classList.toggle('reserved-order-timeline', STATUS_PAGE_RESERVED);
    timeline.setAttribute('data-reserved-order', STATUS_PAGE_RESERVED ? '1' : '0');
  }
  const id=Number(orderId||0);
  if(id){
    const targetHash='#order-status='+id;
    if(window.location.hash!==targetHash){
      history.replaceState(null,'',window.location.pathname+window.location.search+targetHash);
    }
  }
}

/* 顧客端訂單保存：不指定時間保存至「訂單完成＋30分鐘」；指定時間保存至「指定取餐時間＋30分鐘」。 */

(function(){
  const STORAGE_KEY='gekbi_customer_active_order_v1';
  const ORDER_KEY_PREFIX='gekbi_customer_order_v1_';
  const RETENTION_AFTER_COMPLETE_MS=30*60*1000;
  const RETENTION_AFTER_PICKUP_MS=30*60*1000;
  let trackingTimer=null;

  function getOrderIdFromHash(){
    const m=String(window.location.hash||'').match(/^#order-status=(\d+)$/);
    return m ? Number(m[1]) : 0;
  }

  function getOrderStorageKey(orderId){
    return ORDER_KEY_PREFIX+String(Number(orderId)||'');
  }

  function getSavedOrder(){
    try{
      const hashOrderId=getOrderIdFromHash();
      const key=hashOrderId ? getOrderStorageKey(hashOrderId) : STORAGE_KEY;
      const raw=localStorage.getItem(key);
      if(!raw) return null;
      const data=JSON.parse(raw);
      if(!data?.orderId || !data?.phone || !data?.createdAt) return null;
      const expiresAt=Number(data.expiresAt||0);
      const expireTime=expiresAt || (
        data.pickupTime
          ? (getPickupAtMs(data.pickupTime) || (Number(data.createdAt)+RETENTION_AFTER_PICKUP_MS)) + RETENTION_AFTER_PICKUP_MS
          : Number(data.createdAt) + RETENTION_AFTER_COMPLETE_MS
      );
      if(Date.now()>=expireTime){
        localStorage.removeItem(key);
        if(!hashOrderId){
          try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
        }
        return null;
      }
      return data;
    }catch(e){
      return null;
    }
  }

  window.saveCustomerActiveOrder=function(data){
    try{
      const orderId=Number(data?.orderId||0);
      if(!orderId) return;
      // 每張訂單各自保存，避免新訂單覆蓋舊訂單的狀態頁。
      localStorage.setItem(getOrderStorageKey(orderId),JSON.stringify(data));
      // 只把「最後送出的訂單」記為新點餐頁的目前訂單，不會改寫舊訂單資料。
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
    }catch(e){
      console.warn('無法保存顧客端訂單資訊',e);
    }
  };

  function getPickupAtMs(pickupTime){
    if(!pickupTime) return null;
    const now=getTaipeiNow();
    const parts=String(pickupTime).split(':').map(Number);
    if(parts.length<2 || !Number.isFinite(parts[0]) || !Number.isFinite(parts[1])) return null;
    let day=String(now.day).padStart(2,'0');
    let month=String(now.month).padStart(2,'0');
    let year=String(now.year);
    const currentMinutes=now.hour*60+now.minute;
    const pickupMinutes=parts[0]*60+parts[1];
    if(pickupMinutes<currentMinutes){
      const d=new Date(Date.UTC(now.year,now.month-1,now.day)+86400000);
      year=d.getUTCFullYear(); month=String(d.getUTCMonth()+1).padStart(2,'0'); day=String(d.getUTCDate()).padStart(2,'0');
    }
    return Date.parse(`${year}-${month}-${day}T${String(parts[0]).padStart(2,'0')}:${String(parts[1]).padStart(2,'0')}:00+08:00`);
  }

  window.getOrderExpiryAt=function(pickupTime,createdAt,completedAt){
    const pickupAt=getPickupAtMs(pickupTime);
    if(pickupAt) return pickupAt+RETENTION_AFTER_PICKUP_MS;
    if(completedAt) return Number(completedAt)+RETENTION_AFTER_COMPLETE_MS;
    // 尚未完成時先保留；一旦狀態進入「訂單已完成」，會立即改為完成時間＋30分鐘。
    return Number(createdAt)+RETENTION_AFTER_COMPLETE_MS;
  }

  function renderOrderItems(items){
    const card=document.getElementById('orderItemsCard');
    const list=document.getElementById('orderItemsList');
    if(!card||!list) return;
    if(!Array.isArray(items)||!items.length){card.style.display='none';list.innerHTML='';return;}
    list.innerHTML=items.map(item=>{
      const opts=Array.isArray(item.options)?item.options:[];
      const optText=opts.map(o=>`${o.name}${Number(o.price||0)>0?' +$'+Number(o.price).toLocaleString():''}`).join('、');
      return `<div class="order-item-row"><div><div class="order-item-name">${item.name||''}</div>${optText?`<div class="order-item-options">${optText}</div>`:''}</div><div class="order-item-qty">×${Number(item.qty||1)}</div><div class="order-item-price">$${Number(item.price||0).toLocaleString()}</div></div>`;
    }).join('');
    card.style.display='block';
  }
  window.renderOrderItems = renderOrderItems;


  function updateOrderStatusVisual(status){
    const s=String(status||'').trim().toLowerCase();

    const steps=[...document.querySelectorAll('#orderStatusTimeline .status-step')];
    const sent=steps.find(x=>x.dataset.step==='sent');
    const accepted=steps.find(x=>x.dataset.step==='accepted');
    const making=steps.find(x=>x.dataset.step==='making');
    const done=steps.find(x=>x.dataset.step==='done');

    steps.forEach(x=>x.classList.remove('active','done'));

    const setReminder = (key) => {
      const el=document.getElementById('customerStatusNoteText');
      const box=document.getElementById('customerStatusNote');
      const savedOrder = (typeof getSavedOrder==='function') ? getSavedOrder() : null;
      const hasPickupTime = !!String(savedOrder?.pickupTime||'').trim();
      const map={
        sent:'送出訂單後，請耐心等待店家接單。',
        accepted: hasPickupTime
          ? '店家已接單，將於取餐時間前準備餐點。'
          : '店家已接單，餐點開始準備。',
        making:'餐點製作中，請耐心等候。',
        done:'餐點已完成，可前往取餐。取餐時請告知手機末三碼'
      };
      if(el) el.textContent=map[key];
      if(box) box.style.display='';
    };

    if(s==='done'||s==='完成'||s==='已完成'){
      [sent,accepted,making,done].forEach(x=>x&&x.classList.add('done'));
      if(done) done.classList.add('active');
      setReminder('done');
      return;
    }

    if(s==='making'||s==='製作中'){
      [sent,accepted].forEach(x=>x&&x.classList.add('done'));
      if(making) making.classList.add('active');
      setReminder('making');
      return;
    }

    if(s==='accepted'||s==='accept'||s==='已接單'||s==='接單'){
      if(sent) sent.classList.add('done');
      if(accepted) accepted.classList.add('active');
      setReminder('accepted');
      return;
    }

    if(s==='cancelled'||s==='canceled'||s==='取消'||s==='已取消'){
      if(sent) sent.classList.add('done');
      if(accepted) accepted.classList.add('active');
      setReminder('accepted');
      return;
    }

    if(sent) sent.classList.add('active');
    setReminder('sent');
  }

  let customerAcceptedAt=0;
  let customerMakingTimer=null;

  function customerAcceptedStorageKey(orderId){
    return 'gekbi_customerAcceptedAt_' + String(orderId||'unknown');
  }

  function getTaiwanParts(date){
    const parts=new Intl.DateTimeFormat('en-US',{
      timeZone:'Asia/Taipei',
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',
      hour12:false
    }).formatToParts(date);
    const out={};
    parts.forEach(p=>{if(p.type!=='literal')out[p.type]=Number(p.value);});
    return out;
  }

  function taiwanDateToUtc(parts){
    return Date.UTC(parts.year,parts.month-1,parts.day,parts.hour,parts.minute,parts.second||0)-8*60*60*1000;
  }

  function getPickupAtFromOrder(saved,pickupTime){
    const m=String(pickupTime||'').match(/^(\d{1,2}):(\d{2})$/);
    if(!m || !saved?.createdAt) return 0;

    const created=new Date(Number(saved.createdAt));
    if(Number.isNaN(created.getTime())) return 0;

    const p=getTaiwanParts(created);
    const pickupHour=Number(m[1]);
    const pickupMinute=Number(m[2]);

    let day=p.day;
    const createdMinutes=p.hour*60+p.minute;
    const pickupMinutes=pickupHour*60+pickupMinute;

    // 取餐時間若早於下單當下的營業日時間，代表跨日後取餐。
    if(pickupMinutes<=createdMinutes){
      const next=new Date(Date.UTC(p.year,p.month-1,p.day)+24*60*60*1000);
      const np=new Intl.DateTimeFormat('en-US',{
        timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'
      }).formatToParts(next);
      const n={};
      np.forEach(x=>{if(x.type!=='literal')n[x.type]=Number(x.value);});
      day=n.day;
      p.year=n.year;
      p.month=n.month;
    }

    return taiwanDateToUtc({
      year:p.year,month:p.month,day,
      hour:pickupHour,minute:pickupMinute,second:0
    });
  }

  function getCustomerMakingAt(saved,pickupTime){
    const pickupAt=getPickupAtFromOrder(saved,pickupTime);
    return pickupAt ? pickupAt-(20*60*1000) : 0;
  }

  function showCustomerMakingAnimation(){
    const anim=document.getElementById('customerMakingAnimation');
    const statusEl=document.getElementById('successStatus');
    const note=document.getElementById('customerStatusNote');
    if(anim) anim.classList.add('active');
    if(statusEl) statusEl.style.display='none';
    if(note) note.style.display='';
  }

  function showCustomerAccepted(){
    const anim=document.getElementById('customerMakingAnimation');
    const statusEl=document.getElementById('successStatus');
    const note=document.getElementById('customerStatusNote');
    if(anim) anim.classList.remove('active');
    if(statusEl){
      statusEl.style.display='';
      statusEl.textContent='🟢 店家已接單';
    }
    if(note){
      note.style.display='';
      note.textContent='店家已接單，餐點將開始準備。';
    }
  }

  function scheduleCustomerMaking(saved,pickupTime){
    if(customerMakingTimer) clearTimeout(customerMakingTimer);
    customerMakingTimer=null;
    if(!customerAcceptedAt) return;

    let targetAt;
    if(pickupTime){
      // 指定時間訂單：指定取餐時間前 20 分鐘自動進入「餐點製作中」。
      targetAt=getCustomerMakingAt(saved,pickupTime);
    }else{
      // 不指定時間：維持原本接單後 3 分鐘自動進入「餐點製作中」。
      targetAt=customerAcceptedAt+180000;
    }

    if(!targetAt) return;

    const remaining=Math.max(0,targetAt-Date.now());
    if(remaining===0){
      showCustomerMakingAnimation();
      return;
    }

    customerMakingTimer=setTimeout(function(){
      showCustomerMakingAnimation();
      // 不在畫面顯示這個自動跳轉時間點。
    },remaining);
  }

  function statusText(status){
    const s=String(status||'').trim().toLowerCase();
    if(['done','completed','完成','已完成'].includes(s)) return '🟢 餐點已完成';
    if(['cancelled','canceled','取消','已取消'].includes(s)) return '🔴 訂單已取消';
    if(['accepted','accept','已接單','接單'].includes(s)) return '🟢 店家已接單';
    if(['making','製作中'].includes(s)) return '🟠 餐點製作中';
    return '🟡 等待店家接單';
  }

  async function refreshCustomerOrderStatus(){
    const saved=getSavedOrder();
    if(!saved) return false;
    try{
      const {data,error}=await supabaseClient.rpc('get_customer_order_status',{
        p_order_id:Number(saved.orderId),
        p_phone:String(saved.phone)
      });
      if(error) throw error;
      if(!data?.found) return true;

      let status=String(data.status||'').trim().toLowerCase();

      // ===== 指定取餐時間訂單：前端最後一道時間保護 =====
      // 即使資料庫/舊版後台曾把 status 提前寫成 making，
      // 在「指定取餐時間 - 20 分鐘」以前，顧客端一律維持「店家已接單」。
      const reservedPickupTime=String(data.pickup_time||saved.pickupTime||'').trim();
      if(
        reservedPickupTime &&
        ['making','製作中'].includes(status)
      ){
        const reservedMakingAt=getCustomerMakingAt(
          {...saved,createdAt:saved.createdAt||data.created_at},
          reservedPickupTime
        );
        if(reservedMakingAt && Date.now()<reservedMakingAt){
          status='accepted';
        }
      }

      const statusEl=document.getElementById('successStatus');
      const pickupEl=document.getElementById('successPickup');
      const totalEl=document.getElementById('successTotal');
      const note=document.getElementById('customerStatusNote');

      if(pickupEl) pickupEl.textContent=data.pickup_time||'不指定';
      if(totalEl) totalEl.textContent=`$${Number(data.total||saved.total||0).toLocaleString()}`;
      updateOrderStatusVisual(status);
      const countdown=document.getElementById('statusCountdown');
      const pickupDisplay=document.getElementById('statusPickupTime');
      if(countdown){
        const pickupTime=reservedPickupTime;
        if(pickupTime){
          countdown.style.display='block';
          if(pickupDisplay) pickupDisplay.textContent=pickupTime;
        }else{
          countdown.style.display='none';
          if(pickupDisplay) pickupDisplay.textContent='--:--';
        }
      }

      if(['done','completed','完成','已完成'].includes(status)){
        // 不指定時間：第一次確認訂單已完成時記錄完成時間，保存至完成後30分鐘。
        if(!saved.pickupTime && !saved.completedAt){
          saved.completedAt=Date.now();
          saved.expiresAt=saved.completedAt+RETENTION_AFTER_COMPLETE_MS;
          window.saveCustomerActiveOrder(saved);
        }
        if(statusEl){
          statusEl.style.display='';
          statusEl.textContent='🟢 餐點已完成';
        }
        const anim=document.getElementById('customerMakingAnimation');
        if(anim) anim.classList.remove('active');
        // 完成狀態提醒文字由 updateOrderStatusVisual() 統一控制。
        if(customerMakingTimer) clearTimeout(customerMakingTimer);
        customerMakingTimer=null;
        try{localStorage.removeItem(customerAcceptedStorageKey(saved.orderId));}catch(e){}
        stopCustomerOrderTracking();
        return true;
      }

      if(['cancelled','canceled','取消','已取消'].includes(status)){
        if(statusEl){
          statusEl.style.display='';
          statusEl.textContent='🔴 訂單已取消';
        }
        const anim=document.getElementById('customerMakingAnimation');
        if(anim) anim.classList.remove('active');
        // 取消狀態不覆蓋動態狀態列的提醒文字。
        if(customerMakingTimer) clearTimeout(customerMakingTimer);
        customerMakingTimer=null;
        try{localStorage.removeItem(customerAcceptedStorageKey(saved.orderId));}catch(e){}
        stopCustomerOrderTracking();
        return true;
      }

      if(['accepted','accept','已接單','接單'].includes(status)){
        const pickupTime=String(data.pickup_time||saved.pickupTime||'').trim();
        const acceptedKey=customerAcceptedStorageKey(saved.orderId);

        if(!customerAcceptedAt){
          customerAcceptedAt=Number(localStorage.getItem(acceptedKey)||0);
        }
        if(!customerAcceptedAt){
          customerAcceptedAt=Date.now();
          localStorage.setItem(acceptedKey,String(customerAcceptedAt));
        }

        scheduleCustomerMaking(saved,pickupTime);

        const makingAt=pickupTime ? getCustomerMakingAt(saved,pickupTime) : (customerAcceptedAt+180000);
        if(makingAt && Date.now()>=makingAt){
          showCustomerMakingAnimation();
        }else{
          const anim=document.getElementById('customerMakingAnimation');
          if(anim) anim.classList.remove('active');
          if(statusEl){
            statusEl.style.display='';
            statusEl.textContent='🟢 店家已接單';
          }
        }
        return true;
      }

      // 未接單
      if(statusEl){
        statusEl.style.display='';
        statusEl.textContent='🟡 等待店家接單';
      }
      const anim=document.getElementById('customerMakingAnimation');
      if(anim) anim.classList.remove('active');
      // 等待接單提醒文字由 updateOrderStatusVisual() 統一控制。
      if(customerMakingTimer) clearTimeout(customerMakingTimer);
      return true;

    }catch(e){
      console.warn('顧客訂單狀態更新失敗',e);
      return false;
    }
  }

  window.startCustomerOrderTracking=function(){
    stopCustomerOrderTracking();
    refreshCustomerOrderStatus();
    trackingTimer=setInterval(function(){
      if(!getSavedOrder()){stopCustomerOrderTracking();return;}
      refreshCustomerOrderStatus();
    },5000);
  };

  function stopCustomerOrderTracking(){
    if(trackingTimer){clearInterval(trackingTimer);trackingTimer=null;}
  }

  window.addEventListener('focus',function(){
    if(getSavedOrder()) refreshCustomerOrderStatus();
  });
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden && getSavedOrder()) refreshCustomerOrderStatus();
  });

  function restoreCustomerOrder(){
    const saved=getSavedOrder();
    if(!saved) return;

    const idEl=document.getElementById('successOrderId');
    const pickupEl=document.getElementById('successPickup');
    const totalEl=document.getElementById('successTotal');
    const customerEl=document.getElementById('successCustomer');
    const statusEl=document.getElementById('successStatus');
    const success=document.getElementById('successMessage');
    if(!success) return;

    const digits=String(saved.phone).replace(/\D/g,'');
    if(idEl) idEl.textContent=`#${digits.slice(-3)||'—'}`;
    if(pickupEl) pickupEl.textContent=saved.pickupTime||'不指定';
    if(totalEl) totalEl.textContent=`$${Number(saved.total||0).toLocaleString()}`;
    if(customerEl) customerEl.textContent=`${saved.customerName||''}｜手機末三碼 ${digits.slice(-3)}`;
    if(statusEl) statusEl.textContent='🟡 等待店家接單';
    const sentTime=document.getElementById('statusSentTime');
    if(sentTime){ const n=new Date(Number(saved.createdAt)); sentTime.textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(n); }
    renderOrderItems(saved.items||[]);
    document.body.classList.toggle('reserved-order-mode',!!String(saved.pickupTime||'').trim());
    const countdown=document.getElementById('statusCountdown');
    const pickupDisplay=document.getElementById('statusPickupTime');
    if(countdown && saved.pickupTime){
      countdown.style.display='block';
      countdown.classList.add('reserved');
      if(pickupDisplay) pickupDisplay.textContent=saved.pickupTime;
    }else if(countdown){
      countdown.style.display='none';
    }

    const isReservedOrder=!!String(saved.pickupTime||'').trim();
    document.body.classList.toggle('reserved-order-mode',isReservedOrder);
    document.body.setAttribute('data-reserved-order',isReservedOrder?'1':'0');
    const timeline=document.getElementById('orderStatusTimeline');
    if(timeline){
      timeline.classList.toggle('reserved-order-timeline',isReservedOrder);
      timeline.setAttribute('data-reserved-order',isReservedOrder?'1':'0');
    }
    enterCustomerOrderStatusMode(saved.orderId);
    startCustomerOrderTracking();
  }

  window.addEventListener('load',function(){
    // 狀態頁現在會綁定實際訂單編號，例如 #order-status=331。
    // 重新整理後必須依網址中的訂單編號恢復同一筆訂單。
    if(/^#order-status=\d+$/.test(window.location.hash)){
      setTimeout(restoreCustomerOrder,50);
    }
  });
})();
</script>
</body>
</html>
