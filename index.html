let cart=[];
function escapeQuotes(t){return t.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function escapeHtml(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function optionButton(o,single,max){return `<button class="option-btn" data-name="${escapeHtml(o[0])}" data-price="${o[1]}" data-single="${single?1:0}" data-max="${max||0}" onclick="toggleOption(this)">${o[0]}${o[1]>0?` <span class="option-price">+${o[1]}</span>`:""}</button>`}
function collapseAllCategories(){
  document.querySelectorAll('.category-items.category-open').forEach(box=>{
    box.classList.remove('category-open');
  });
  document.querySelectorAll('.category-toggle.category-open').forEach(btn=>{
    btn.classList.remove('category-open');
  });
}

function toggleCategory(catId){
  const box=document.getElementById(catId);
  if(!box)return;
  const btn=document.querySelector(`[data-category-target="${catId}"]`);
  if(!btn)return;

  const wasOpen=box.classList.contains('category-open');

  // 收合其他分類
  document.querySelectorAll('.category-items.category-open').forEach(other=>{
    if(other!==box)other.classList.remove('category-open');
  });
  document.querySelectorAll('.category-toggle.category-open').forEach(otherBtn=>{
    if(otherBtn!==btn)otherBtn.classList.remove('category-open');
  });

  box.classList.toggle('category-open',!wasOpen);
  btn.classList.toggle('category-open',!wasOpen);

  if(!wasOpen){
    // 展開後，將「被點選的大項標題」直接定位到畫面最上方，
    // 下面立刻就是該分類的品項，顧客不需要再手動滑動。
    setTimeout(()=>{
      const top=btn.getBoundingClientRect().top + window.scrollY;
      window.scrollTo({top:Math.max(0,top-6),left:0,behavior:'smooth'});
    },30);
  }
}
function renderCategory(m,mi){
  const catId=`category-${mi}`;
  let html=`<div class="category-toggle" data-category-target="${catId}" onclick="toggleCategory('${catId}')">
    <span>${m[0]}</span><span class="category-arrow">▼</span>
  </div><div class="category-items" id="${catId}">`;
  m[1].forEach((it,ii)=>{
    const id=`menu-${mi}-${ii}`;
    const sold=isSoldOut(id);
    const click=sold?"":`onclick="openItemBrowse(${mi},${ii},'${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openItemBrowse(${mi},${ii},'${id}')}"`;
    html+=`<div class="item menu-card ${sold?'sold-out-item':''}" id="${id}" role="button" tabindex="${sold?-1:0}" ${click}>
      <div class="item-info"><div class="item-name">${it[0]}</div><div class="price">$${it[1]}</div></div>
      ${sold?'<span class="sold-badge">完售</span>':''}
    </div>`;
  });
  return html+`</div>`;
}

function renderHiddenCategory(){
  const catId='category-hidden';
  let html=`<div class="category-toggle" data-category-target="${catId}" onclick="toggleCategory('${catId}')">
    <span>隱藏版菜單</span><span class="category-arrow">▼</span>
  </div><div class="category-items" id="${catId}">
    <div class="hidden-subtitle">隱藏版餐點｜數量有限，售完為止</div>`;
  hiddenMenus.forEach((it,i)=>{
    const id=`hidden-${i}`;
    const sold=isSoldOut(id);
    const click=sold?"":`onclick="openHiddenOptions(${i},'${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openHiddenOptions(${i},'${id}')}"`;
    html+=`<div class="item menu-card ${sold?'sold-out-item':''}" id="${id}" role="button" tabindex="${sold?-1:0}" ${click}>
      <div class="item-info"><div class="item-name">${it[0]}</div><div class="price">$${it[1]}</div></div>
      ${sold?'<span class="sold-badge">完售</span>':''}
    </div>`;
  });
  return html+`</div>`;
}

function renderMenu(){
  let html="";
  menus.forEach((m,mi)=>{
    // Exact order requested: hidden menu goes after 秘製鍋燒 and before 點心炸物.
    html+=renderCategory(m,mi);
    if(m[0].includes("秘製鍋燒")) html+=renderHiddenCategory();
  });
  document.getElementById('menu').innerHTML=html;
}
function openItemBrowse(mi,ii,itemId){
  const item=menus[mi][1][ii];
  const name=item[0], price=item[1];
  const old=document.getElementById('browse-'+itemId);
  if(old){old.remove();return}

  const config=menus[mi][2];
  let html=`<div class="inline-option-box browse-box" id="browse-${itemId}" data-base-name="${escapeHtml(name)}" data-base-price="${price}" data-mi="${mi}" data-ii="${ii}">
    <div class="option-group">`;

  if(menus[mi][0].includes("鍋燒")){
    const noodles=[["意麵",0],["雞絲",0],["冬粉",0],["泡麵",0],["烏龍麵",20]];
    const extras=[["加麵",15],["起司",10],["豆皮",20]];
    html+=`<div class="option-group-title">麵體</div>
      <div class="option-list">${noodles.map(o=>optionButton(o,true)).join("")}</div>
      <div class="option-group-title" style="margin-top:14px">加料</div>
      <div class="option-list">${extras.map(o=>optionButton(o,false)).join("")}</div>`;
    if(name==="起司牛奶鍋燒"){
      html+=`<div class="option-group-title" style="margin-top:14px">口味</div>
        <div class="option-list">${optionButton(["麻辣",10],false)}</div>`;
    }
  }else if(name==="香蒜厚片"){
    html+=`<div class="browse-description">此餐點無細項</div>`;
  }else if(name==="原味蛋餅"){
    html+=`<div class="option-group-title">細項</div><div class="option-list">${optionButton(["雙蛋",15],false)}</div>`;
  }else if(config && config.jam && name==="果醬吐司"){
    html+=`<div class="option-group-title">果醬口味（請選1種）</div><div class="option-list">${[["巧克力",0],["花生",0],["草莓",0]].map(o=>optionButton(o,true)).join('')}</div>`;
  }else if(config && config.options){
    let options=config.options.slice();
    if(name==="豬排黑胡椒麵"||name==="豬排蘑菇麵"){
      options=options.filter(o=>o[0]!=="麻辣"&&o[0]!=="香辣"&&o[0]!=="加辣");
    }
    if(config.noNoodleExtra && config.noNoodleExtra.includes(name)){
      options=options.filter(o=>o[0]!=="加麵");
    }
    html+=`<div class="option-group-title">選擇細項</div><div class="option-list">${options.map(o=>optionButton(o,false)).join('')}</div>`;
  }else{
    html+=`<div class="quantity-direct" data-qty="1">
      <div class="quantity-label">數量</div>
      <div class="quantity-controls">
        <button type="button" onclick="event.stopPropagation();changeDirectQty('${itemId}',-1)">−</button>
        <span id="direct-qty-${itemId}">1</span>
        <button type="button" onclick="event.stopPropagation();changeDirectQty('${itemId}',1)">＋</button>
      </div>
    </div>`;
  }

  const noOptions=!config;
  const purchaseDisabled=!isOrderingOpen();
  if(!noOptions){
    html+=`<button class="confirm-option" ${purchaseDisabled?'disabled style="opacity:.55;pointer-events:none"':''} onclick="event.stopPropagation();confirmBrowseAdd('${itemId}')">加入購物車</button>`;
  }else{
    html+=`<button class="confirm-option direct-add-btn" ${purchaseDisabled?'disabled style="opacity:.55;pointer-events:none"':''} onclick="event.stopPropagation();confirmDirectAdd('${itemId}')">加入購物車</button>`;
  }
  html+=`<button class="cancel-option" onclick="event.stopPropagation();closeBrowse('${itemId}')">返回菜單</button>
  </div>`;

  const card=document.getElementById(itemId);
  if(card) card.insertAdjacentHTML('afterend',html);
  applyOrderingHours();
}
function changeDirectQty(itemId,delta){
  const box=document.getElementById('browse-'+itemId);
  if(!box)return;
  let qty=Number(box.dataset.qty||1)+delta;
  if(qty<1)qty=1;
  box.dataset.qty=qty;
  const el=document.getElementById('direct-qty-'+itemId);
  if(el)el.textContent=qty;
}
function confirmDirectAdd(itemId){
  if(!isOrderingOpen())return;
  const box=document.getElementById('browse-'+itemId);
  if(!box)return;
  const qty=Math.max(1,Number(box.dataset.qty||1));
  for(let i=0;i<qty;i++){
    addToCart(box.dataset.baseName,Number(box.dataset.basePrice),[]);
  }
  box.remove();
}

function closeBrowse(itemId){
  const box=document.getElementById('browse-'+itemId);
  if(box)box.remove();
}

function confirmBrowseAdd(itemId){
  if(!isOrderingOpen())return;
  const box=document.getElementById('browse-'+itemId);
  if(!box)return;
  const name=box.dataset.baseName;
  const basePrice=Number(box.dataset.basePrice);
  const selected=Array.from(box.querySelectorAll('.option-btn.selected'));

  if(name==="果醬吐司" && !selected.length){
    alert("請選擇果醬口味！");
    return;
  }
  if(document.querySelector(`#browse-${itemId}`) && box.querySelector('[data-name="意麵"],[data-name="雞絲"],[data-name="冬粉"],[data-name="泡麵"],[data-name="烏龍麵"]') && !box.querySelector('.option-btn[data-name="意麵"].selected,.option-btn[data-name="雞絲"].selected,.option-btn[data-name="冬粉"].selected,.option-btn[data-name="泡麵"].selected,.option-btn[data-name="烏龍麵"].selected')){
    alert("請選擇麵體！");
    return;
  }

  let extra=0;
  const options=selected.map(b=>{
    const p=Number(b.dataset.price||0);
    extra+=p;
    return {name:b.dataset.name,price:p};
  });

  addToCart(name,basePrice+extra,options);
  box.remove();
}

function handleAdd(name,price,itemId,mi,ii){
if(!isOrderingOpen())return;
if(name==="香蒜厚片")return addToCart(name,price,[]); if(name==="原味蛋餅")return openOptions(name,price,{type:"蛋餅",options:[["雙蛋",15]]},itemId);
const config=menus[mi][2];
if(menus[mi][0].includes('鍋燒'))return openHotpotOptions(name,price,itemId);
if(!config)return addToCart(name,price,[]);
if(config.jam&&name==="果醬吐司")return openJamOptions(name,price,itemId);
let localConfig=JSON.parse(JSON.stringify(config));
if(name==="豬排黑胡椒麵"||name==="豬排蘑菇麵"){
  localConfig.options=localConfig.options.filter(o=>o[0]!=="麻辣"&&o[0]!=="香辣"&&o[0]!=="加辣");
}
if(config.noNoodleExtra&&config.noNoodleExtra.includes(name))localConfig.options=localConfig.options.filter(o=>o[0]!=="加麵");
openOptions(name,price,localConfig,itemId)}
function openJamOptions(name,price,itemId){
  const existing=document.getElementById('option-'+itemId);
  if(existing){
    existing.scrollIntoView({behavior:'smooth',block:'nearest'});
    return;
  }
  const html=`<div class="inline-option-box" id="option-${itemId}" data-base-name="${escapeHtml(name)}" data-base-price="${price}">
    <div class="option-title">${name}｜選擇口味</div>
    <div class="option-group">
      <div class="option-group-title">果醬口味（請選1種）</div>
      <div class="option-list">${[["巧克力",0],["花生",0],["草莓",0]].map(o=>optionButton(o,true)).join('')}</div>
    </div>
    <button class="confirm-option" onclick="confirmInlineOptions('${itemId}')">確認加入購物車</button>
    <button class="cancel-option" onclick="closeOptions('${itemId}')">關閉</button>
  </div>`;
  insertOptionBox(itemId,html);
}
function openHotpotOptions(name,price,itemId){const old=document.getElementById('option-'+itemId);if(old){old.remove();return}const noodles=[["意麵",0],["雞絲",0],["冬粉",0],["泡麵",0],["烏龍麵",20]];const extras=[["加麵",15],["起司",10],["豆皮",20]];let html=`<div class="inline-option-box" id="option-${itemId}" data-base-name="${escapeHtml(name)}" data-base-price="${price}"><div class="option-title">${name}｜選擇細項</div><div class="option-group"><div class="option-group-title">麵體</div><div class="option-list">${noodles.map(o=>optionButton(o,true)).join('')}</div></div><div class="option-group"><div class="option-group-title">加料</div><div class="option-list">${extras.map(o=>optionButton(o,false)).join('')}</div></div>`;if(name==='起司牛奶鍋燒')html+=`<div class="option-group"><div class="option-group-title">口味</div><div class="option-list">${optionButton(["麻辣",10],false)}</div></div>`;html+=`<button class="confirm-option" onclick="confirmInlineOptions('${itemId}')">確認加入購物車</button><button class="cancel-option" onclick="closeOptions('${itemId}')">關閉</button></div>`;insertOptionBox(itemId,html)}
function openOptions(name,price,config,itemId){
const old=document.getElementById('option-'+itemId);if(old){old.remove();return}
let html=`<div class="inline-option-box" id="option-${itemId}" data-base-name="${escapeHtml(name)}" data-base-price="${price}"><div class="option-title">${name}｜選擇細項</div>`;
if(config.options){
  if(config.type==="個人特餐"){
    const drink=config.options.filter(o=>o[0]==="奶茶"||o[0]==="冷泡茶");

    const spicy=config.options.filter(o=>o[0]==="麻辣"||o[0]==="香辣");
    if(other.length)html+=`<div class="option-group"><div class="option-group-title">其他細項</div><div class="option-list">${other.map(o=>optionButton(o,false)).join('')}</div></div>`;
    if(spicy.length)html+=`<div class="option-group" data-mutual="spicy"><div class="option-group-title">辣度（只能選1種）</div><div class="option-list">${spicy.map(o=>optionButton(o,true)).join('')}</div></div>`;

html+=`<button class="confirm-option" onclick="confirmInlineOptions('${itemId}')">確認加入購物車</button><button class="cancel-option" onclick="closeOptions('${itemId}')">關閉</button></div>`;
insertOptionBox(itemId,html)}

      </div>

      <div class="option-group-title">奶酥(不吃請勿選擇)</div>

      <div class="option-group-title">炸物 4 選 1(奶酥不吃請選兩樣)</div>

        ${item[2][2].options.map(o=>optionButton(o,false,1)).join('')}

function selectPackageMain(btn,itemId){
  const box=document.getElementById('option-'+itemId);
  box.querySelectorAll('.package-main-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');

  const mainName=btn.dataset.name;
  let options=[];

  // 豬排套餐三種主餐：細項只保留「加麵」；豬排炒泡麵另外提供加辣，
  // 不顯示飲品。
  if(mainName==='豬排炒泡麵'){
    options=[["加麵",15],["麻辣",5],["香辣",15]];
  }else if(mainName==='豬排蘑菇麵'){
    options=[["加麵",15]];
  }else if(mainName==='豬排黑胡椒麵'){
    options=[["加麵",15]];
  }

  const target=document.getElementById('package-main-detail-'+itemId);
  let html=`<div class="inline-option-box package-main-detail-box" data-main="${escapeHtml(mainName)}">`;

  const spicy=options.filter(o=>o[0]==='麻辣'||o[0]==='香辣');
  const noodle=options.filter(o=>o[0]==='加麵');

  if(noodle.length){
    html+=`<div class="option-group">
      <div class="option-group-title">加麵</div>
      <div class="option-list">${noodle.map(o=>optionButton(o,false)).join('')}</div>
    </div>`;
  }
  if(spicy.length){
    html+=`<div class="option-group" data-mutual="main-spicy">
      <div class="option-group-title">加辣</div>
      <div class="option-list">${spicy.map(o=>optionButton(o,true)).join('')}</div>
    </div>`;
  }

  html+=`</div>`;
  target.innerHTML=html;
}
function insertOptionBox(itemId,html){
  const existing=document.getElementById('option-'+itemId);
  if(existing){
    existing.outerHTML=html;
    return;
  }
  document.getElementById(itemId).insertAdjacentHTML('afterend',html);
  applyOrderingHours();
}
function toggleOption(btn){const box=btn.closest('.inline-option-box');const group=btn.closest('.option-group');const isSingle=btn.dataset.single==='1';const max=Number(btn.dataset.max||0);if(isSingle){
  if(btn.classList.contains('selected')){btn.classList.remove('selected')}
  else{group.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}
}else{const selected=group.querySelectorAll('.option-btn.selected');if(!btn.classList.contains('selected')&&max===1&&selected.length>=1){selected.forEach(b=>b.classList.remove('selected'));btn.classList.add('selected')}else if(!btn.classList.contains('selected')&&max&&selected.length>=max){alert(`最多選 ${max} 項`);return}else{btn.classList.toggle('selected')}}const fried=box?.querySelector('[data-group="fried"]');const cream=box?.querySelector('[data-group="cream"]');if(fried&&cream){const creamSelected=cream.querySelector('.option-btn.selected');const friedBtns=fried.querySelectorAll('.option-btn');const limit=creamSelected?1:2;friedBtns.forEach(b=>{b.dataset.max=limit});const current=fried.querySelectorAll('.option-btn.selected');if(current.length>limit){current.forEach((b,i)=>{if(i>=limit)b.classList.remove('selected')})}fried.querySelector('.option-group-title').textContent=`炸物 4 選 ${limit}${creamSelected?'':'(奶酥不吃請選兩樣)'}`}}
function confirmInlineOptions(itemId){
if(!isOrderingOpen())return;
const box=document.getElementById('option-'+itemId);
const name=box.dataset.baseName,basePrice=Number(box.dataset.basePrice);
const selected=Array.from(box.querySelectorAll('.option-btn.selected'));

if(name==='果醬吐司'&&!selected.length){alert('請選擇果醬口味！');return}
if(name.includes('鍋燒')&&!selected.some(b=>['意麵','雞絲','冬粉','泡麵','烏龍麵'].includes(b.dataset.name))){alert('請先選擇麵體！');return}

if(box.dataset.package==='0'){
  const mainBtn=box.querySelector('[data-group="main"] .option-btn.selected');
  const cream=box.querySelector('[data-group="cream"] .option-btn.selected');
  const fried=box.querySelectorAll('[data-group="fried"] .option-btn.selected');
  const drink=box.querySelector('[data-group="drink"] .option-btn.selected');
  if(!mainBtn){alert('請先選擇主餐！');return}
  if(!cream&&fried.length!==2){alert('奶酥不吃請選兩樣炸物！');return}
  if(cream&&fried.length!==1){alert('選擇奶酥後，炸物請選1樣！');return}
  if(!drink){alert('請選擇飲品！');return}

  const mainDetail=box.querySelector('.package-main-detail-box');
  let options=[];
  let extra=0;

  if(mainDetail){
    mainDetail.querySelectorAll('.option-btn.selected').forEach(b=>{
      const p=Number(b.dataset.price||0);
      extra+=p;
      options.push({name:b.dataset.name,price:p,group:(b.closest('.option-group')?.dataset.group||'extra')});
    });
  }

  options.push({name:mainBtn.dataset.name,price:0,group:'main'});
  if(cream)options.push({name:cream.dataset.name,price:0,group:'cream'});
  fried.forEach(b=>options.push({name:b.dataset.name,price:0,group:'fried'}));
  options.push({name:drink.dataset.name,price:Number(drink.dataset.price||0),group:'drink'});
  extra+=Number(drink.dataset.price||0);

  addToCart(name,basePrice+extra,options);
  box.remove();
  return;
}
let extra=0;
const options=selected.map(b=>{
  const p=Number(b.dataset.price);extra+=p;
  const g=b.closest('.option-group');
  let group=g?.dataset.group||'extra';
  const title=g?.querySelector('.option-group-title')?.textContent||'';
  if(title.includes('主餐'))group='main';
  else if(title.includes('奶酥'))group='cream';
  else if(title.includes('炸物'))group='fried';
  else if(title.includes('飲品'))group='drink';
  return{name:b.dataset.name,price:p,group};
});
if(name==='單人經濟套餐'){
  const drink=box.querySelector('[data-group="drink"] .option-btn.selected');
  if(!drink){alert('請選擇飲品！');return}
  // 主餐、炸物已在畫面上以固定反黑選項存在，selected 已會被上面的
  // 通用流程收集，因此這裡不再重複加入。
}
addToCart(name,basePrice+extra,options);
box.remove();
}

function closePackageDetail(){
  const box=document.getElementById('package-main-detail');
  if(box) box.remove();
}

function confirmPackageDetail(){
  const box=document.getElementById('package-main-detail');
  if(!box)return;

  const mainName=box.dataset.main;
  const mainDetail=Array.from(box.querySelectorAll('[data-group="main-detail"] .option-btn.selected,[data-group="main-drink"] .option-btn.selected,[data-group="main-spicy"] .option-btn.selected'));
  const cream=box.querySelector('[data-group="cream"] .option-btn.selected');
  const fried=box.querySelectorAll('[data-group="fried"] .option-btn.selected');
  const drink=box.querySelector('[data-group="drink"] .option-btn.selected');

  if(!cream&&fried.length!==2){alert('奶酥不吃請選兩樣炸物！');return}
  if(cream&&fried.length!==1){alert('選擇奶酥後，炸物請選1樣！');return}
  if(!drink){alert('請選擇飲品！');return}

  let options=[];
  let extra=0;

  mainDetail.forEach(b=>{const p=Number(b.dataset.price);extra+=p;options.push({name:b.dataset.name,price:p})});
  if(cream)options.push({name:cream.dataset.name,price:0});
  fried.forEach(b=>options.push({name:b.dataset.name,price:0}));
  if(drink){const p=Number(drink.dataset.price);extra+=p;options.push({name:drink.dataset.name,price:p})}

  addToCart('豬排大套餐｜'+mainName,Number(box.dataset.basePrice)+extra,options);
  box.remove();
}
function closeOptions(itemId){const box=document.getElementById('option-'+itemId);if(box)box.remove()}
function addToCart(name,price,options){
  const opts=options||[];
  const key=JSON.stringify({
    name,
    options:[...opts].sort((a,b)=>(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name)||Number(a.price)-Number(b.price))
      .map(o=>[o.name,Number(o.price||0),o.group||''])
  });
  const existing=cart.find(item=>{
    const itemKey=JSON.stringify({
      name:item.name,
      options:[...(item.options||[])].sort((a,b)=>(a.group||'').localeCompare(b.group||'')||a.name.localeCompare(b.name)||Number(a.price)-Number(b.price))
        .map(o=>[o.name,Number(o.price||0),o.group||''])
    });
    return itemKey===key;
  });
  if(existing){
    existing.qty+=1;
  }else{
    cart.push({name,price,options:opts,qty:1});
  }
  renderCart();
}
function sortCartOptions(options){
  const getRank=(o)=>{
    const n=String(o?.name||'');
    const g=String(o?.group||'');
    // 1. 主餐
    if(g==='main'||g.includes('主餐')) return 10;
    // 2. 奶酥優先，再炸物
    if(g==='cream'||g.includes('奶酥')) return 20;
    if(g==='fried'||g.includes('炸物')) return 30;
    // 3. 加麵／加辣／加起司
    if(g==='extra'||g.includes('加麵')||g.includes('加辣')||g.includes('加起司')) return 40;
    // 4. 飲品最後
    if(g==='drink'||g.includes('飲品')) return 50;

    // 舊資料／沒有 group 時的文字判斷。
    if(/加麵|加辣|加起司/.test(n)) return 40;
    if(/紅茶|奶茶|冷泡茶|麥茶|咖啡|可樂|雪碧|飲料|飲品/.test(n)) return 50;
    return 35;
  };
  return [...(options||[])]
    .map((o,i)=>({...o,__order:getRank(o),__index:i}))
    .sort((a,b)=>a.__order-b.__order||a.__index-b.__index)
    .map(({__order,__index,...o})=>o);
}
function renderCart(){
  const el=document.getElementById('cartItems');
  if(!cart.length){
    el.innerHTML='尚未選擇餐點';
    document.getElementById('total').textContent='0';
    document.getElementById('count').textContent='0';
    return;
  }
  let html='',total=0,count=0;
  cart.forEach((item,i)=>{
    const itemTotal=item.price*item.qty;
    total+=itemTotal; count+=item.qty;
    const sorted=sortCartOptions(item.options||[]);
    const opt=sorted.length?`<div class="cart-options">細項：${sorted.map(o=>o.name+(o.price>0?' +'+o.price:'')).join('、')}</div>`:'';
    html+=`<div class="cart-row"><div class="cart-main"><div class="cart-name">${item.name}</div>${opt}</div>
    <div class="cart-actions-inline">
      <button onclick="changeQty(${i},-1)">−</button><span class="cart-qty">${item.qty}</span><button onclick="changeQty(${i},1)">＋</button>
      <span class="cart-price">$${itemTotal}</span><button class="cart-delete" onclick="removeItem(${i})">刪除</button>
    </div></div>`;
  });
  el.innerHTML=html;
  document.getElementById('total').textContent=total;
  document.getElementById('count').textContent=count;
}

function changeQty(i,a){cart[i].qty+=a;if(cart[i].qty<=0)cart.splice(i,1);renderCart()}
function removeItem(i){cart.splice(i,1);renderCart()}

function pad2(n){return String(n).padStart(2,'0')}
function initPickupTimes(){
  const select=document.getElementById('pickupTime');
  if(!select)return;
  select.innerHTML='';
  const first=document.createElement('option');
  first.value='';
  first.textContent='不指定（等候店家點選完成訂單即可取餐）';
  select.appendChild(first);

  // 固定顯示營業時段可選取餐時間，避免非點餐時間預覽時
  // 出現凌晨/白天等不符合店家營業時間的選項。
  const start=new Date();
  start.setHours(18,30,0,0);

  // 18:30 ～ 隔日 01:40，每 10 分鐘一個選項。
  const end=new Date(start);
  end.setDate(end.getDate()+1);
  end.setHours(1,40,0,0);

  for(let t=new Date(start); t<=end; t.setTime(t.getTime()+10*60000)){
    const option=document.createElement('option');
    const h=String(t.getHours()).padStart(2,'0');
    const m=String(t.getMinutes()).padStart(2,'0');
    option.value=`${h}:${m}`;
    option.textContent=`${h}:${m}`;
    select.appendChild(option);
  }
}
function buildOrderSummary(){
  let total=0;
  let html='<div class="order-confirm-title">請再次確認您的訂單</div>';
  html+='<div class="order-confirm-warm">溫馨提醒：送出前再確認一次餐點與細項，避免點錯喔！</div>';
  html+='<div class="order-confirm-list">';
  cart.forEach(item=>{
    total+=item.price*item.qty;
    html+=`<div class="confirm-item">
      <div class="confirm-item-main"><span>${escapeHtml(item.name)}</span><strong>× ${item.qty}</strong><b>$${item.price*item.qty}</b></div>`;
    if(item.options?.length){
      html+=`<div class="confirm-item-options">${sortCartOptions(item.options).map(o=>escapeHtml(o.name)+(o.price>0?` +$${o.price}`:'')).join('、')}</div>`;
    }
    html+='</div>';
  });
  html+=`</div><div class="confirm-total">合計：$${total}</div>`;
  return html;
}

function showOrderConfirm(){
  const modal=document.getElementById('orderConfirmModal');
  const body=document.getElementById('orderConfirmBody');
  body.innerHTML=buildOrderSummary();
  modal.style.display='flex';
}

function closeOrderConfirm(){
  document.getElementById('orderConfirmModal').style.display='none';
}

function confirmAndSubmitOrder(){
  closeOrderConfirm();
  const cutlery=document.querySelector('input[name="cutlery"]:checked')?.value||'需要';
  const name=document.getElementById('customerName').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const pickup=document.getElementById('pickupTime').value;
  let total=0;
  let message='隔壁宵夜彰化店\n\n取餐人：'+name+'\n手機：'+phone+'\n取餐時間：'+(pickup||'不指定（等候店家點選完成訂單即可取餐）')+'\n是否需要餐具：'+cutlery+'\n\n';
  cart.forEach(item=>{
    total+=item.price*item.qty;
    message+=item.name+' × '+item.qty+' $'+(item.price*item.qty)+'\n';
    if(item.options?.length)message+='細項：'+sortCartOptions(item.options).map(o=>o.name+(o.price>0?' +'+o.price:'')).join('、')+'\n';
  });
  message+='\n合計：$'+total+'\n\n請等待店家通知「餐點完成」即可取餐。';
  if(navigator.share){
    navigator.share({title:'隔壁宵夜彰化店訂單',text:message}).then(()=>document.getElementById('successMessage').style.display='block').catch(()=>{});
  }else{
    alert(message);
    document.getElementById('successMessage').style.display='block';
  }
}

function submitOrder(){
  if(!isOrderingOpen())return;
  if(!cart.length){alert('請先選擇餐點！');return}
  const nameEl=document.getElementById('customerName'),phoneEl=document.getElementById('phone');
  const name=nameEl.value.trim(),phone=phoneEl.value.trim();
  nameEl.classList.remove('input-error');phoneEl.classList.remove('input-error');
  if(!name){nameEl.classList.add('input-error');nameEl.focus();return}
  if(!phone){phoneEl.classList.add('input-error');phoneEl.focus();return}
  showOrderConfirm();
}

function isOrderingOpen(){
  const now=new Date();
  const mins=now.getHours()*60+now.getMinutes();
  // 每日 18:00 ～ 隔日 01:10
  return mins>=18*60 || mins<=1*60+10;
}
let orderingNoticeDismissed=false;

function closeOrderingNotice(){
  orderingNoticeDismissed=true;
  document.getElementById('orderClosed').style.display='none';
  document.body.style.overflow='';
}

function applyOrderingHours(){
  const closed=document.getElementById('orderClosed');
  const open=isOrderingOpen();

  if(open){
    orderingNoticeDismissed=false;
    closed.style.display='none';
    document.body.style.overflow='';
  }else if(!orderingNoticeDismissed){
    closed.style.display='flex';
    document.body.style.overflow='hidden';
  }

  // 非開放時間：可以瀏覽菜單，但不能加入購物車、確認細項或送出訂單。
  document.querySelectorAll('.add-btn,.confirm-option,.submit-btn').forEach(btn=>{
    btn.disabled=!open;
    btn.style.opacity=open?'1':'.55';
    btn.style.pointerEvents=open?'auto':'none';
  });
  // 品項框框與瀏覽功能不受營業時間限制。
  document.querySelectorAll('.menu-card').forEach(card=>{
    card.style.pointerEvents='auto';
    card.style.opacity='1';
  });
}

renderMenu();renderCart();initPickupTimes();applyOrderingHours();setInterval(applyOrderingHours,60000);
</script>

    if(e.target.value.trim()) e.target.classList.remove('input-error');
  }
});
</script>

<div id="orderConfirmModal" class="order-confirm-modal" style="display:none">
  <div class="order-confirm-dialog">
    <div id="orderConfirmBody"></div>
    <div class="order-confirm-actions">
      <button type="button" class="order-confirm-continue" onclick="closeOrderConfirm()">繼續點餐</button>
      <button type="button" class="order-confirm-submit" onclick="confirmAndSubmitOrder()">確認</button>
    </div>
  </div>
</div>
