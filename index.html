<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>隔壁宵夜彰化店｜手機點餐</title>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;

  background:#f5f5f5;

  color:#222;

}

header{

  background:#111;

  color:#fff;

  text-align:center;

  padding:25px 16px;

}

header h1{

  margin:0;

  font-size:30px;

}

header p{

  margin:8px 0 0;

  color:#ccc;

  font-size:16px;

}

.container{

  max-width:760px;

  margin:auto;

  padding:16px 16px 140px;

}

.notice{

  background:#fff;

  border-radius:16px;

  padding:18px;

  margin-bottom:20px;

  box-shadow:0 2px 10px rgba(0,0,0,.06);

  text-align:center;

  font-size:17px;

  line-height:1.8;

}

.category{

  font-size:23px;

  font-weight:800;

  margin:28px 2px 12px;

}

.item{

  background:#fff;

  border-radius:15px;

  padding:16px;

  margin-bottom:11px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:12px;

  box-shadow:0 2px 9px rgba(0,0,0,.06);

}

.item-info{

  flex:1;

}

.item-name{

  font-size:18px;

  font-weight:700;

}

.price{

  margin-top:5px;

  font-size:18px;

  color:#d35400;

  font-weight:800;

}

.add-btn{

  border:0;

  background:#111;

  color:white;

  border-radius:11px;

  padding:11px 16px;

  font-size:16px;

  min-width:72px;

}

.small{

  color:#777;

  font-size:13px;

  line-height:1.7;

  margin:4px 2px 10px;

}

.cart{

  background:#fff;

  border-radius:16px;

  padding:18px;

  margin-top:30px;

  box-shadow:0 2px 10px rgba(0,0,0,.07);

}

.cart h2{

  margin:0 0 15px;

}

.cart-row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:12px 0;

  border-bottom:1px solid #eee;

  font-size:16px;

}

.cart-row button{

  border:0;

  background:#eee;

  font-size:18px;

  padding:5px 9px;

  border-radius:7px;

}

.total{

  text-align:right;

  font-size:22px;

  font-weight:800;

  margin:18px 0;

}

.order-form label{

  display:block;

  margin:13px 0 0;

  font-size:16px;

}

input,

select,

textarea{

  width:100%;

  padding:13px;

  margin-top:7px;

  border:1px solid #ddd;

  border-radius:11px;

  font-size:16px;

}

.submit-btn{

  width:100%;

  border:0;

  background:#d35400;

  color:white;

  padding:15px;

  border-radius:12px;

  font-size:18px;

  font-weight:800;

  margin-top:10px;

}

.bottom-cart{

  position:fixed;

  left:12px;

  right:12px;

  bottom:12px;

  background:#111;

  color:white;

  padding:15px 18px;

  border-radius:16px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  box-shadow:0 5px 20px rgba(0,0,0,.25);

  z-index:10;

}

.bottom-cart button{

  border:0;

  background:#d35400;

  color:white;

  padding:11px 17px;

  border-radius:10px;

  font-size:16px;

}

</style>

</head>

<body>

<header>

  <h1>隔壁宵夜彰化店</h1>

  <p>手機點餐系統｜外帶專用</p>

</header>

<div class="container">

<div class="notice">

  🥡 外帶點餐<br>

  選擇餐點 → 加入購物車 → 填寫資料 → 完成訂單

  <div class="small">

    彰化市仁愛路149號｜04-7222297

  </div>

</div>

<div id="menu"></div>

<div class="cart" id="cartBox">

<h2>🛒 訂單</h2>

<div id="cartItems">

  尚未選擇餐點

</div>

<div class="total">

  合計：$<span id="total">0</span>

</div>

<div class="order-form">

<label>取餐人姓名</label>

<input id="customerName" type="text" placeholder="請輸入姓名">

<label>手機號碼</label>

<input id="phone" type="tel" placeholder="請輸入手機號碼">

<label>預計取餐時間</label>

<select id="pickupTime">

  <option value="">請選擇</option>

  <option>立即取餐</option>

  <option>30分鐘後</option>

  <option>1小時後</option>

  <option>其他時間</option>

</select>

<label>備註</label>

<textarea

  id="note"

  rows="3"

  placeholder="例如：不要香菜、辣度需求等">

</textarea>

<button class="submit-btn" onclick="submitOrder()">

  確認送出訂單

</button>

</div>

</div>

</div>

<div class="bottom-cart">

<div>

  🛒 已選 <span id="count">0</span> 項

</div>

<button onclick="document.getElementById('cartBox').scrollIntoView({behavior:'smooth'})">

  查看訂單

</button>

</div>

<script>

const menus = [

[

"🥛 隔壁奶酥",

[

["經典原味厚奶酥",60],

["日式抹茶厚奶酥",60],

["可可朗尼厚奶酥",60],

["香濃花生厚奶酥",60],

["經典芝麻麻厚奶酥",60],

["香蒜厚片",50]

],

"厚奶酥可加起司 +10、麻糬 +15、酥皮 +15"

],

[

"🥚 美味蛋餅",

[

["原味蛋餅",35],

["起司蛋餅",40],

["火腿蛋餅",45],

["熱狗蛋餅",50],

["培根蛋餅",50],

["鮪魚蛋餅",50],

["薯餅蛋餅",55],

["豬排蛋餅",55],

["咔啦雞排蛋餅",60],

["可可脆脆蛋餅",65]

],

"可加雙蛋 +15、起司 +10"

],

[

"🍞 經典吐司",

[

["起司蛋吐司",45],

["火腿蛋吐司",50],

["培根蛋吐司",55],

["鮪魚蛋吐司",55],

["薯餅蛋吐司",60],

["豬排蛋吐司",60],

["咔啦雞排蛋吐司",65],

["熱狗捲",35],

["果醬吐司（巧克力／花生／草莓）",25]

],

"可加起司 +10"

],

[

"🥤 飲品",

[

["紅茶",25],

["麥茶",25],

["奶茶",35],

["冷泡茶",45]

],

"紅茶固定甜度去冰；麥茶無糖去冰、每日限量；奶茶固定甜度去冰；冷泡茶無糖去冰"

],

[

"🍜 個人特餐－附紅茶",

[

["豬排黑胡椒麵",100],

["豬排蘑菇麵",100],

["豬排炒泡麵",105]

],

"皆有附蛋；可加麵 +15、奶茶 +10、冷泡茶 +15、麻辣 +5、香辣 +15"

],

[

"🍜 招牌麵食（乾）",

[

["古早味紅蔥雞絲麵",50],

["古早味剝椒雞絲麵",60],

["招牌炒泡麵",80],

["沙茶炒泡麵",85],

["招牌麻辣炒泡麵",85],

["香辣炒泡麵",95],

["豬排拌拌麵（大）",90]

],

"皆有附蛋；可加麵 +15、起司 +10"

],

[

"🍲 燉製鍋燒（湯）",

[

["原味鍋燒",95],

["沙茶鍋燒",105],

["麻辣鍋燒",105],

["咖哩鍋燒",115],

["起司牛奶鍋燒",125],

["泰式冬陰鍋燒",130]

],

"皆有附蛋；可選意麵／雞絲／冬粉／泡麵；加麵 +15、起司 +10、豆皮 +20、烏龍麵 +20、麻辣 +10、不要火鍋料"

],

[

"🍟 點心炸物",

[

["荷包蛋",20],

["單點豬排",30],

["熱狗",30],

["薯餅",30],

["小肉豆",35],

["甜不辣",40],

["炸湯圓",40],

["薯條",40],

["玉米布丁酥",40],

["小雞球",45],

["麥香雞塊",45],

["咔啦雞排（辣）",45],

["酥炸杏鮑菇",45],

["雙色地瓜QQ球",45],

["芋泥球",45],

["魷米花",50],

["土魠魚塊（炸）",55],

["炸元寶",65],

["日式炸豬排",70]

]

]

];

let cart = [];

function renderMenu(){

  let html = "";

  menus.forEach(function(menu){

    const category = menu[0];

    const items = menu[1];

    const note = menu[2];

    html += `<div class="category">${category}</div>`;

    items.forEach(function(item){

      const name = item[0];

      const price = item[1];

      html += `

      <div class="item">

        <div class="item-info">

          <div class="item-name">

            ${name}

          </div>

          <div class="price">

            $${price}

          </div>

        </div>

        <button

          class="add-btn"

          onclick="addItem('${name.replace(/'/g,"\\'")}',${price})">

          加入

        </button>

      </div>

      `;

    });

    if(note){

      html += `

      <div class="small">

        ※ ${note}

      </div>

      `;

    }

  });

  document.getElementById("menu").innerHTML = html;

}

function addItem(name,price){

  const existing = cart.find(function(item){

    return item.name === name;

  });

  if(existing){

    existing.qty++;

  }else{

    cart.push({

      name:name,

      price:price,

      qty:1

    });

  }

  updateCart();

}

function updateCart(){

  const cartBox =

    document.getElementById("cartItems");

  if(cart.length === 0){

    cartBox.innerHTML = "尚未選擇餐點";

    document.getElementById("total").innerText = "0";

    document.getElementById("count").innerText = "0";

    return;

  }

  let html = "";

  let total = 0;

  let count = 0;

  cart.forEach(function(item,index){

    const subtotal =

      item.price * item.qty;

    total += subtotal;

    count += item.qty;

    html += `

    <div class="cart-row">

      <div>

        ${item.name}<br>

        × ${item.qty}

      </div>

      <div>

        $${subtotal}

        <button

          onclick="removeItem(${index})">

          ❌

        </button>

      </div>

    </div>

    `;

  });

  cartBox.innerHTML = html;

  document.getElementById("total").innerText =

    total;

  document.getElementById("count").innerText =

    count;

}

function removeItem(index){

  cart.splice(index,1);

  updateCart();

}

function submitOrder(){

  if(cart.length === 0){

    alert("請先選擇餐點！");

    return;

  }

  const name =

    document.getElementById("customerName").value.trim();

  const phone =

    document.getElementById("phone").value.trim();

  const time =

    document.getElementById("pickupTime").value;

  const note =

    document.getElementById("note").value.trim();

  if(!name || !phone || !time){

    alert("請完整填寫取餐資料！");

    return;

  }

  let message =

    "訂單已建立！\n\n";

  cart.forEach(function(item){

    message +=

      item.name +

      " × " +

      item.qty +

      "\n";

  });

  message +=

    "\n總金額：$" +

    document.getElementById("total").innerText;

  message +=

    "\n取餐人：" +

    name;

  message +=

    "\n電話：" +

    phone;

  message +=

    "\n取餐時間：" +

    time;

  if(note){

    message +=

      "\n備註：" +

      note;

  }

  alert(message);

}

renderMenu();

</script>

</body>

</html>
