function renderMenu(){

  let html = "";

  menus.forEach(function(menu){

    const category = menu[0];

    const items = menu[1];

    const options = menu[2];

    html += `<div class="category">${category}</div>`;

    items.forEach(function(item){

      const name = item[0];

      const price = item[1];

      html += `

      <div class="item">

        <div class="item-info">

          <div class="item-name">

            ${name}

          </div>

          <div class="price">

            $${price}

          </div>

        </div>

        <button

          class="add-btn"

          onclick='openOptions(${JSON.stringify(name)},${price},${JSON.stringify(options)})'>

          加入

        </button>

      </div>

      `;

    });

  });

    <div class="hidden-title">

      🔥 隱藏版菜單

    </div>

    <div class="hidden-subtitle">

      隱藏版餐點｜數量有限，售完為止

  `;

    const price = item[1];

    const groups = item[2];

        </button>

      </div>

    `;

  });

/* =========================

   一般餐點細項

========================= */

function openOptions(name,price,config){

  if(!config || (!config.options && !config.groups)){

    addToCart(name,price,[]);

    return;

  }

  let html = `

    <div class="option-box" id="optionBox">

      <div class="option-title">

        ${name}｜選擇細項

      </div>

  `;

  if(config.options){

    html += `

      <div class="option-group">

        <div class="option-group-title">

          可加購

        </div>

        <div class="option-list">

    `;

    config.options.forEach(function(option){

      html += `

        <button

          class="option-btn"

          data-name="${option[0]}"

          data-price="${option[1]}"

          onclick="toggleOption(this)">

          ${option[0]}

          ${option[1] > 0 ? `<span class="option-price"> +${option[1]}</span>` : ""}

        </button>

      `;

    });

    html += `

        </div>

      </div>

    `;

  }

  if(config.groups){

    config.groups.forEach(function(group){

      html += `

        <div class="option-group">

          <div class="option-group-title">

            ${group.title}

          </div>

          <div class="option-list">

      `;

      group.options.forEach(function(option){

        html += `

          <button

            class="option-btn"

            data-name="${option[0]}"

            data-price="${option[1]}"

            data-single="${group.single ? "1" : "0"}"

            onclick="toggleGroupOption(this)">

            ${option[0]}

            ${option[1] > 0 ? `<span class="option-price"> +${option[1]}</span>` : ""}

          </button>

        `;

      });

      html += `

          </div>

        </div>

      `;

    });

  }

  html += `

      <button

        class="confirm-option"

        onclick="confirmOptions('${escapeText(name)}',${price})">

        確認加入購物車

      </button>

      <button

        class="cancel-option"

        onclick="closeOptions()">

        取消

      </button>

    </div>

  `;

  const existing = document.getElementById("optionBox");

  if(existing){

    existing.remove();

  }

  document.getElementById("menu").insertAdjacentHTML("beforeend",html);

  setTimeout(function(){

    document.getElementById("optionBox").scrollIntoView({

      behavior:"smooth",

      block:"center"

    });

  },100);

}

========================= */

function toggleOption(button){

  button.classList.toggle("selected");

}

function toggleGroupOption(button){

  const group = button.parentElement;

  const single = button.dataset.single === "1";

  if(single){

    group.querySelectorAll(".option-btn").forEach(function(btn){

      btn.classList.remove("selected");

    });

  }

  button.classList.toggle("selected");

}

/* =========================

   確認細項

========================= */

function confirmOptions(name,basePrice){

  const box = document.getElementById("optionBox");

  const buttons = box.querySelectorAll(".option-btn.selected");

  let options = [];

  let extra = 0;

  buttons.forEach(function(button){

    const optionName = button.dataset.name;

    const optionPrice = Number(button.dataset.price);

    options.push({

      name:optionName,

      price:optionPrice

    });

    extra += optionPrice;

  });

  addToCart(name,basePrice + extra,options);

  closeOptions();

}

/* =========================

   關閉細項

========================= */

function closeOptions(){

  const box = document.getElementById("optionBox");

  if(box){

    box.remove();

  }

}

/* =========================

   加入購物車

========================= */

function addToCart(name,price,options){

  cart.push({

    name:name,

    price:price,

    options:options || [],

    qty:1

  });

  renderCart();

}

/* =========================

   購物車

========================= */

function renderCart(){

  const cartItems = document.getElementById("cartItems");

  let total = 0;

  let count = 0;

  if(cart.length === 0){

    cartItems.innerHTML = "尚未選擇餐點";

    document.getElementById("total").textContent = "0";

    document.getElementById("count").textContent = "0";

    return;

  }

  let html = "";

  cart.forEach(function(item,index){

    const itemTotal = item.price * item.qty;

    total += itemTotal;

    count += item.qty;

    let optionText = "";

    if(item.options && item.options.length){

      optionText = item.options

        .map(function(option){

          return option.name +

            (option.price > 0 ? ` +${option.price}` : "");

        })

        .join("、");

    }

    html += `

      <div class="cart-row">

        <div class="cart-main">

          <div>

            <div class="cart-name">

              ${item.name} × ${item.qty}

            </div>

            ${

              optionText

              ?

              `<div class="cart-options">

                細項：${optionText}

              </div>`

              :

              ""

            }

          </div>

          <div class="cart-price">

            $${itemTotal}

          </div>

        </div>

        <div class="cart-controls">

          <button onclick="changeQty(${index},-1)">

            −

          </button>

          <button onclick="changeQty(${index},1)">

            ＋

          </button>

          <button onclick="removeItem(${index})">

            刪除

          </button>

        </div>

      </div>

    `;

  });

  cartItems.innerHTML = html;

  document.getElementById("total").textContent = total;

  document.getElementById("count").textContent = count;

}

/* =========================

   數量

========================= */

function changeQty(index,amount){

  cart[index].qty += amount;

  if(cart[index].qty <= 0){

    cart.splice(index,1);

  }

  renderCart();

}

/* =========================

   刪除

========================= */

function removeItem(index){

  cart.splice(index,1);

  renderCart();

}

/* =========================

   送出訂單

========================= */

function submitOrder(){

  if(cart.length === 0){

    alert("請先選擇餐點");

    return;

  }

  const name =

    document.getElementById("customerName").value.trim();

  const phone =

    document.getElementById("phone").value.trim();

  const note =

    document.getElementById("note").value.trim();

  if(!name){

    alert("請輸入取餐人姓名");

    return;

  }

  if(!phone){

    alert("請輸入手機號碼");

    return;

  }

  let total = 0;

  cart.forEach(function(item){

    total += item.price * item.qty;

  });

  let orderText =

    "隔壁宵夜彰化店\n\n" +

    "取餐人：" + name + "\n" +

    "手機：" + phone + "\n\n";

  cart.forEach(function(item){

    orderText +=

      item.name +

      " × " +

      item.qty +

      " $" +

      (item.price * item.qty) +

      "\n";

    if(item.options && item.options.length){

      orderText +=

        "細項：" +

        item.options

          .map(function(o){

            return o.name +

              (o.price > 0 ? " +" + o.price : "");

          })

          .join("、") +

        "\n";

    }

  });

  orderText +=

    "\n合計：$" +

    total +

    "\n\n";

  if(note){

    orderText +=

      "備註：" +

      note +

      "\n\n";

  }

  orderText +=

    "※ 客人送出訂單後，等待店家通知「餐點完成」即可取餐。";

  /*

    目前 GitHub Pages 為靜態網站，

    暫時使用手機分享功能讓客人送出訂單。

  */

  if(navigator.share){

    navigator.share({

      title:"隔壁宵夜彰化店訂單",

      text:orderText

    }).then(function(){

      document.getElementById("successMessage").style.display="block";

    }).catch(function(){

    });

  }else{

    alert(orderText);

    document.getElementById("successMessage").style.display="block";

  }

}

/* =========================

   防止字串問題

========================= */

function escapeText(text){

  return text

    .replace(/\\/g,"\\\\")

    .replace(/'/g,"\\'");

}

/* =========================

   啟動

========================= */

renderMenu();

renderCart();

</script>
