<body>

<header>

  <h1 class="shop-title">隔壁宵夜彰化店</h1>

  <p class="subtitle">線上點餐系統｜自取專用</p>

</header>

<main class="container">

<div class="notice">

  <div class="notice-title">📍 隔壁宵夜彰化店</div>

  <div class="address">

    <a class="shop-contact-link" href="https://www.google.com/maps/search/?api=1&query=彰化市仁愛路149號" target="_blank">彰化市仁愛路149號</a>

    <span>｜</span>

    <a class="shop-contact-link" href="tel:047235570">04-7235570</a>

  </div>

  <div class="ordering-hours-card">

    <div class="hours-title">🕐 線上點餐時間</div>

    <div class="hours-time">18:00 ～ 隔日 01:10</div>

    <div class="hours-note">自取專用｜非點餐時間仍可瀏覽菜單</div>

  </div>

  <div id="orderingClosedInlineNotice" class="non-ordering-inline-notice" style="display:none;">

    <div class="notice-title">🌙 目前尚未開放線上點餐</div>

    <div class="notice-sub">今日 18:00 開放下單｜菜單仍可瀏覽</div>

  </div>

</div>

<div id="categorySelector" class="category-selector-wrap"></div>

<div id="menu"></div>

<section id="cartSection" class="cart">

  <h2>🛒 購物車</h2>

  <div id="cartItems"></div>

  <div class="total">合計：$<span id="cartTotal">0</span></div>

  <div class="order-form">

    <label for="customerName">姓 / 先生or小姐</label>

    <input id="customerName" type="text" placeholder="例如：翁先生">

    <label for="phone">手機號碼</label>

    <input id="phone" type="tel" inputmode="tel" placeholder="09xxxxxxxx">

    <label for="pickupTime">取餐時間</label>

    <select id="pickupTime">

      <option value="">不指定</option>

      <option>18:30</option>

      <option>19:00</option>

      <option>19:30</option>

      <option>20:00</option>

      <option>20:30</option>

      <option>21:00</option>

      <option>21:30</option>

      <option>22:00</option>

      <option>22:30</option>

      <option>23:00</option>

      <option>23:30</option>

      <option>00:00</option>

      <option>00:30</option>

      <option>01:00</option>

    </select>

    <label>餐具</label>

    <div class="cutlery-choice">

      <label><input type="radio" name="cutlery" value="需要" checked> 需要</label>

      <label><input type="radio" name="cutlery" value="不需要"> 不需要</label>

    </div>

    <button class="submit-btn" type="button" onclick="openOrderConfirm()">確認送出訂單</button>

  </div>

  <div id="successMessage" class="success"></div>

</section>

</main>

<div class="bottom-cart">

  <div class="bottom-cart-info">

    <strong>🛒 已選 <span id="bottomCartCount">0</span> 項</strong>

    <strong>總計 $<span id="bottomCartTotal">0</span></strong>

  </div>

  <button type="button" onclick="document.getElementById('cartSection').scrollIntoView({behavior:'smooth'})">結帳</button>

</div>

<div id="orderConfirmModal" class="order-confirm-modal" style="display:none;">

  <div class="order-confirm-dialog">

    <div class="order-confirm-title">請再次確認您的訂單</div>

    <div class="order-confirm-warm">

      溫馨提醒：送出前再確認一次餐點與細項，避免點錯喔！

    </div>

    <div id="orderConfirmList" class="order-confirm-list"></div>

    <div class="confirm-total">合計：$<span id="orderConfirmTotal">0</span></div>

    <div class="order-confirm-actions">

      <button type="button" class="order-confirm-continue" onclick="closeOrderConfirm()">繼續點餐</button>

      <button type="button" class="order-confirm-submit" onclick="submitOrder()">確認</button>

    </div>

  </div>

</div>

<script>

const SUPABASE_URL='https://gbszychd.supabase.co';

const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';

let cart=[];

let menuData=[];

let orderingOpen=false;

let storeClosedBannerDismissed=false;

const categories=[

  {id:'main',name:'主餐'},

  {id:'noodles',name:'麵類'},

  {id:'fried',name:'炸物'},

  {id:'drinks',name:'飲料'},

  {id:'hidden',name:'隱藏版'}

];

const menuSeed=[

  {id:'main-1',category:'main',name:'經典原味蛋餅',price:70,description:'起司 +$15'},

function normalizeTaiwanMobile(value){

  let phone=String(value||'').trim().replace(/[\s-]/g,'');

  if(phone.startsWith('+886')){

    phone='0'+phone.slice(4);

  }else if(phone.startsWith('8869')){

    phone='0'+phone.slice(3);

  }

  return phone;

}

function isValidTaiwanMobile(value){

  const phone=normalizeTaiwanMobile(value);

  return /^09\d{8}$/.test(phone);

}

function validateTaiwanMobile(value){

  return isValidTaiwanMobile(value);

}

function escapeHtml(value){

  return String(value??'')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');

}

function getCategories(){

  return categories;

}

function getCategoryName(id){

  const item=categories.find(x=>x.id===id);

  return item?item.name:id;

}

function getMenuData(){

  return menuData.length?menuData:menuSeed;

}

function getItemById(id){

  return getMenuData().find(x=>x.id===id);

}

function renderCategorySelector(){

  const wrap=document.getElementById('categorySelector');

  if(!wrap)return;

  wrap.innerHTML=getCategories().map((cat,index)=>`

    <button

      type="button"

      class="category-selector-btn ${index===0?'active':''}"

      onclick="selectCategory('${cat.id}',this)">

      ${escapeHtml(cat.name)}

    </button>

  `).join('');

}

function selectCategory(id,btn){

  document.querySelectorAll('.category-selector-btn').forEach(x=>x.classList.remove('active'));

  if(btn)btn.classList.add('active');

  const target=document.getElementById('category-'+id);

  if(target){

    target.scrollIntoView({behavior:'smooth',block:'start'});

  }

}

function renderMenu(){

  const menu=document.getElementById('menu');

  if(!menu)return;

  const data=getMenuData();

  menu.innerHTML=getCategories().map(cat=>{

    const items=data.filter(item=>item.category===cat.id);

    return `

      <section id="category-${cat.id}" class="menu-section">

        <div class="category-toggle category-open" onclick="toggleCategory('${cat.id}')">

          <span>${escapeHtml(cat.name)}</span>

          <span class="category-arrow">▼</span>

        </div>

        <div id="category-items-${cat.id}" class="category-items category-open">

          ${items.map(renderMenuItem).join('')}

        </div>

      </section>

    `;

  }).join('');

}

function renderMenuItem(item){

  const soldOut=item.sold_out===true;

  return `

    <div class="item menu-card ${soldOut?'sold-out-item':''}" onclick="${soldOut?'':'addToCart(\''+item.id+'\')'}">

      <div class="item-info">

        <div class="item-name">${escapeHtml(item.name)}</div>

        <div class="item-price">$${Number(item.price||0)}</div>

      </div>

      ${soldOut

        ? '<span class="sold-badge">完售</span>'

        : '<button class="add-btn" type="button" onclick="event.stopPropagation();addToCart(\''+item.id+'\')">加入</button>'}

    </div>

  `;

}

function toggleCategory(id){

  const items=document.getElementById('category-items-'+id);

  const toggle=document.querySelector('#category-'+id+' .category-toggle');

  if(!items)return;

  items.classList.toggle('category-open');

  if(toggle)toggle.classList.toggle('category-open');

}

function addToCart(id){

  const item=getItemById(id);

  if(!item)return;

  if(item.sold_out===true)return;

  const existing=cart.find(x=>x.id===id && !x.options);

  if(existing){

    existing.qty++;

  }else{

    cart.push({

      id:item.id,

      name:item.name,

      price:Number(item.price||0),

      qty:1,

      options:'',

      description:item.description||''

    });

  }

  renderCart();

}

function changeCartQty(index,delta){

  if(!cart[index])return;

  cart[index].qty+=delta;

  if(cart[index].qty<=0)cart.splice(index,1);

  renderCart();

}

function removeCartItem(index){

  cart.splice(index,1);

  renderCart();

}

function cartTotal(){

  return cart.reduce((sum,item)=>sum+(Number(item.price||0)*Number(item.qty||0)),0);

}

function cartCount(){

  return cart.reduce((sum,item)=>sum+Number(item.qty||0),0);

}

function renderCart(){

  const wrap=document.getElementById('cartItems');

  if(!wrap)return;

  if(!cart.length){

    wrap.innerHTML='<div style="color:#888;padding:10px 0;">目前尚未選擇餐點</div>';

  }else{

    wrap.innerHTML=cart.map((item,index)=>`

      <div class="cart-row">

        <div class="cart-main">

          <div style="min-width:0;">

            <div class="cart-name">${escapeHtml(item.name)} × ${item.qty}</div>

            ${item.options?`<div class="cart-options">${escapeHtml(item.options)}</div>`:''}

          </div>

        </div>

        <div class="cart-actions-inline">

          <button type="button" onclick="changeCartQty(${index},-1)">−</button>

          <span class="cart-qty">${item.qty}</span>

          <button type="button" onclick="changeCartQty(${index},1)">＋</button>

          <span class="cart-price">$${Number(item.price*item.qty)}</span>

          <button type="button" class="cart-delete" onclick="removeCartItem(${index})">✕</button>

        </div>

      </div>

    `).join('');

  }

  const total=cartTotal();

  document.getElementById('cartTotal').textContent=total.toLocaleString();

  document.getElementById('bottomCartTotal').textContent=total.toLocaleString();

  document.getElementById('bottomCartCount').textContent=cartCount();

}

function openOrderConfirm(){

  if(!cart.length){

    alert('請先選擇餐點');

    return;

  }

  if(!orderingOpen){

    alert('目前尚未開放線上點餐，今日 18:00 開放下單。');

    return;

  }

  const name=document.getElementById('customerName');

  const phone=document.getElementById('phone');

  if(!name.value.trim()){

    name.classList.add('input-error');

    name.focus();

    alert('請輸入姓名／稱呼');

    return;

  }

  if(!isValidTaiwanMobile(phone.value)){

    phone.classList.add('input-error');

    phone.focus();

    alert('請輸入有效的台灣手機號碼（09 開頭共 10 碼）。');

    return;

  }

  name.classList.remove('input-error');

  phone.classList.remove('input-error');

  const list=document.getElementById('orderConfirmList');

  list.innerHTML=cart.map(item=>`

    <div class="confirm-item">

      <div class="confirm-item-main">

        <strong>${escapeHtml(item.name)}</strong>

        <span>× ${item.qty}</span>

        <b>$${Number(item.price*item.qty).toLocaleString()}</b>

      </div>

      ${item.options?`<div class="confirm-item-options">${escapeHtml(item.options)}</div>`:''}

    </div>

  `).join('');

  document.getElementById('orderConfirmTotal').textContent=cartTotal().toLocaleString();

  document.getElementById('orderConfirmModal').style.display='flex';

}

function closeOrderConfirm(){

  document.getElementById('orderConfirmModal').style.display='none';

}

function getCutlery(){

  const selected=document.querySelector('input[name="cutlery"]:checked');

  return selected?selected.value:'需要';

}

async function submitOrder(){

  if(!cart.length){

    closeOrderConfirm();

    alert('購物車目前沒有餐點');

    return;

  }

  const customerName=document.getElementById('customerName').value.trim();

  const rawPhone=document.getElementById('phone').value;

  const phone=normalizeTaiwanMobile(rawPhone);

  const pickupTime=document.getElementById('pickupTime').value;

  const cutlery=getCutlery();

  if(!customerName){

    closeOrderConfirm();

    alert('請輸入姓名／稱呼');

    document.getElementById('customerName').focus();

    return;

  }

  if(!isValidTaiwanMobile(phone)){

    closeOrderConfirm();

    alert('請輸入有效的台灣手機號碼（09 開頭共 10 碼）。');

    document.getElementById('phone').focus();

    return;

  }

  if(!orderingOpen){

    closeOrderConfirm();

    alert('目前尚未開放線上點餐。');

    return;

  }

  const orderPayload={

    customer_name:customerName,

    phone:phone,

    pickup_time:pickupTime||null,

    cutlery,

    order_type:'pickup',

    total:cartTotal(),

    items:cart.map(item=>({

      id:item.id,

      name:item.name,

      price:item.price,

      qty:item.qty,

      options:item.options||''

    }))

  };

  try{

    /*

      這裡保留原本送單架構。

      若你的 Supabase Edge Function 已經部署，

      可直接把 URL 放在下面。

    */

    const functionUrl=SUPABASE_URL+'/functions/v1/create-order';

    const response=await fetch(functionUrl,{

      method:'POST',

      headers:{

        'Content-Type':'application/json',

        'apikey':SUPABASE_ANON_KEY,

        'Authorization':'Bearer '+SUPABASE_ANON_KEY

      },

      body:JSON.stringify(orderPayload)

    });

    if(!response.ok){

      throw new Error('訂單送出失敗');

    }

    const result=await response.json().catch(()=>({}));

    const orderId=result.order_id||result.id||Date.now();

    localStorage.setItem('gekbi_last_order',JSON.stringify({

      orderId,

      customerName,

      phone,

      pickupTime,

      total:cartTotal(),

      createdAt:new Date().toISOString()

    }));

    closeOrderConfirm();

    const success=document.getElementById('successMessage');

    success.style.display='block';

    success.innerHTML=`

      <div class="success-title">✅ 訂單已送出</div>

      <div class="success-grid">

        <div>

          <span>訂單編號</span>

          <strong>#${escapeHtml(String(orderId))}</strong>

        </div>

        <div>

          <span>取餐時間</span>

          <strong>${escapeHtml(pickupTime||'不指定')}</strong>

        </div>

      </div>

      <div class="success-grid">

        <div>

          <span>訂單金額</span>

          <strong>$${cartTotal().toLocaleString()}</strong>

        </div>

        <div>

          <span>餐具</span>

          <strong>${escapeHtml(cutlery)}</strong>

        </div>

      </div>

      <div class="success-note">

        店家收到訂單後會進行確認，請留意手機。

      </div>

    `;

    cart=[];

    renderCart();

  }catch(error){

    console.error(error);

    closeOrderConfirm();

    alert('訂單送出失敗，請稍後再試。');

  }

}

function updateOrderingStatus(){

  const now=new Date();

  const hour=now.getHours();

  const minute=now.getMinutes();

  const current=hour*60+minute;

  const open=18*60;

  const close=24*60+70;

  orderingOpen=current>=open || current<=70;

  const notice=document.getElementById('orderingClosedInlineNotice');

  if(notice){

    notice.style.display=orderingOpen?'none':'flex';

  }

}

function setupInputValidation(){

  const name=document.getElementById('customerName');

  const phone=document.getElementById('phone');

  if(name){

    name.addEventListener('input',function(){

      this.classList.remove('input-error');

    });

  }

  if(phone){

    phone.addEventListener('input',function(){

      this.classList.remove('input-error');

    });

  }

}

function getSavedOrder(){

  try{

    return JSON.parse(localStorage.getItem('gekbi_last_order')||'null');

  }catch(e){

    return null;

  }

}

let trackingTimer=null;

async function refreshCustomerOrderStatus(){

  const saved=getSavedOrder();

  if(!saved)return;

  const success=document.getElementById('successMessage');

  if(!success)return;

  /*

    保留前台訂單追蹤介面。

    若後端查詢 API 存在，可在這裡接續。

  */

}

window.startCustomerOrderTracking=function(){

  stopCustomerOrderTracking();

  refreshCustomerOrderStatus();

  trackingTimer=setInterval(function(){

    if(!getSavedOrder()){

      stopCustomerOrderTracking();

      return;

    }

    refreshCustomerOrderStatus();

  },5000);

};

function stopCustomerOrderTracking(){

  if(trackingTimer){

    clearInterval(trackingTimer);

    trackingTimer=null;

  }

}

window.addEventListener('focus',function(){

  if(getSavedOrder())refreshCustomerOrderStatus();

});

document.addEventListener('visibilitychange',function(){

  if(!document.hidden && getSavedOrder()){

    refreshCustomerOrderStatus();

  }

});

function restoreCustomerOrder(){

  const saved=getSavedOrder();

  if(!saved)return;

  const success=document.getElementById('successMessage');

  if(!success)return;

  const digits=String(saved.phone||'').replace(/\D/g,'');

  success.style.display='block';

  success.innerHTML=`

    <div class="success-title">📋 最近訂單</div>

    <div class="success-grid">

      <div>

        <span>訂單編號</span>

        <strong>#${escapeHtml(String(saved.orderId||digits.slice(-3)||'—'))}</strong>

      </div>

      <div>

        <span>取餐時間</span>

        <strong>${escapeHtml(saved.pickupTime||'不指定')}</strong>

      </div>

    </div>

    <div class="success-grid">

      <div>

        <span>訂單金額</span>

        <strong>$${Number(saved.total||0).toLocaleString()}</strong>

      </div>

      <div>

        <span>手機末三碼</span>

        <strong>${escapeHtml(digits.slice(-3)||'—')}</strong>

      </div>

    </div>

    <div class="success-note">

      🟡 等待店家接單

    </div>

  `;

  startCustomerOrderTracking();

}

function closeStoreHolidayModalV24(){

  storeClosedBannerDismissed=true;

  const modal=document.getElementById('storeHolidayModalV24');

  if(modal){

    modal.classList.remove('show');

    modal.setAttribute('aria-hidden','true');

  }

}

window.addEventListener('DOMContentLoaded',function(){

  menuData=menuSeed.slice();

  renderCategorySelector();

  renderMenu();

  renderCart();

  setupInputValidation();

  updateOrderingStatus();

  setInterval(updateOrderingStatus,30000);

  setTimeout(restoreCustomerOrder,50);

});

</script>

<!--

=========================================================

以下為店家後台圖片管理入口

網址後面加：

?admin=1

例如：

index.html?admin=1

只有店家自己知道此入口。

=========================================================

<div id="adminEntry" style="display:none;max-width:760px;margin:20px auto;padding:16px;">

  <div style="background:#111;color:#fff;border-radius:16px;padding:18px;">

    <h2 style="margin:0 0 8px;">🔐 店家後台</h2>

    <p style="margin:0;color:#ccc;font-size:14px;">餐點圖片管理</p>

  </div>

  <div style="background:#fff;border-radius:16px;padding:18px;margin-top:12px;">

    <label style="font-weight:800;">管理員帳號</label>

    <input id="adminEmail" type="email" placeholder="管理員 Email">

    <label style="font-weight:800;display:block;margin-top:12px;">管理員密碼</label>

    <input id="adminPassword" type="password" placeholder="密碼">

    <button type="button" onclick="adminLogin()" style="width:100%;margin-top:14px;border:0;background:#111;color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800;">

      登入後台

    </button>

    <div id="adminStatus" style="margin-top:12px;font-size:14px;"></div>

  </div>

  <div id="imageAdminPanel" style="display:none;background:#fff;border-radius:16px;padding:18px;margin-top:12px;">

    <h3 style="margin-top:0;">📷 餐點圖片管理</h3>

    <label style="font-weight:800;">選擇餐點</label>

    <select id="imageMenuItem"></select>

    <label style="font-weight:800;display:block;margin-top:14px;">上傳圖片</label>

    <input id="menuImageFile" type="file" accept="image/*">

    <button type="button" onclick="uploadMenuImage()" style="width:100%;margin-top:14px;border:0;background:#d35400;color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800;">

      上傳／覆蓋圖片

    </button>

    <div id="imageAdminStatus" style="margin-top:12px;font-size:14px;"></div>

  </div>

</div>

<script>

async function adminLogin(){

  const email=document.getElementById('adminEmail').value.trim();

  const password=document.getElementById('adminPassword').value;

  const status=document.getElementById('adminStatus');

  if(!email||!password){

    status.textContent='請輸入帳號與密碼';

    status.style.color='#c00';

    return;

  }

  /*

    後台登入保留。

    若 Supabase Auth 已設定，

    可使用 signInWithPassword。

  */

  status.textContent='登入功能已保留，請確認 Supabase Auth 設定。';

  status.style.color='#666';

  document.getElementById('imageAdminPanel').style.display='block';

  const select=document.getElementById('imageMenuItem');

  select.innerHTML=getMenuData().map(item=>`

    <option value="${escapeHtml(item.id)}">

      ${escapeHtml(item.name)}

    </option>

  `).join('');

}

async function uploadMenuImage(){

  const fileInput=document.getElementById('menuImageFile');

  const itemId=document.getElementById('imageMenuItem').value;

  const status=document.getElementById('imageAdminStatus');

  if(!fileInput.files.length){

    status.textContent='請先選擇圖片';

    status.style.color='#c00';

    return;

  }

  if(!itemId){

    status.textContent='請先選擇餐點';

    status.style.color='#c00';

    return;

  }

  const file=fileInput.files[0];

  if(!file.type.startsWith('image/')){

    status.textContent='請選擇圖片檔案';

    status.style.color='#c00';

    return;

  }

  status.textContent='圖片上傳中……';

  status.style.color='#555';

  /*

    保留原本 Supabase Storage 圖片上傳架構。

    Bucket 名稱：

    menu-images

    圖片檔名：

    餐點 ID

  */

  try{

    const safeName=itemId.replace(/[^a-zA-Z0-9_-]/g,'_');

    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();

    const path=safeName+'.'+ext;

    const response=await fetch(

      SUPABASE_URL+'/storage/v1/object/menu-images/'+encodeURIComponent(path),

      {

        method:'POST',

        headers:{

          'apikey':SUPABASE_ANON_KEY,

          'Authorization':'Bearer '+SUPABASE_ANON_KEY,

          'Content-Type':file.type,

          'x-upsert':'true'

        },

        body:file

      }

    );

    if(!response.ok){

      throw new Error('圖片上傳失敗');

    }

    const publicUrl=

      SUPABASE_URL+

      '/storage/v1/object/public/menu-images/'+

      encodeURIComponent(path);

    status.innerHTML=

      '✅ 圖片上傳完成<br>'+

      '<a href="'+publicUrl+'" target="_blank">查看圖片</a>';

    status.style.color='#217a35';

  }catch(error){

    console.error(error);

    status.textContent='❌ 圖片上傳失敗，請確認 Supabase Storage 設定。';

    status.style.color='#c00';

  }

}

(function(){

  const params=new URLSearchParams(location.search);

  const enabled=params.get('admin')==='1' || location.hash==='#admin';

  const entry=document.getElementById('adminEntry');

  if(entry && enabled){

    entry.style.display='block';

  }

})();

</script>
