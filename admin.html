<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>隔壁宵夜彰化店｜店家後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}
.login-title{text-align:center;font-size:24px;font-weight:800;margin-bottom:6px}
.login-sub{text-align:center;color:#777;font-size:14px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:46px;border:1px solid #ddd;border-radius:10px;padding:0 13px;outline:none}
.field input:focus{border-color:#111}
.login-btn{width:100%;height:48px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800}
.error{color:#d00;font-size:14px;margin-top:12px;text-align:center}

.header{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:12px 14px}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:18px;font-weight:800}
.logout{border:1px solid #555;background:#222;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}

.main{max-width:900px;margin:auto;padding:14px 12px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:900}
.stat-label{font-size:12px;color:#777;margin-top:3px}

.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:12px}
.tab{flex:0 0 auto;border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;font-size:14px}
.tab.active{background:#111;color:#fff;border-color:#111}

.order{background:#fff;border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.order-head{padding:12px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid #eee}
.order-no{font-weight:900;font-size:16px}
.order-time{font-size:13px;color:#777;margin-top:3px}
.status{font-size:12px;font-weight:800;padding:5px 8px;border-radius:7px;white-space:nowrap}
.status-new{background:#ffe7e7;color:#c00}
.status-making{background:#fff1d6;color:#a05a00}
.status-done{background:#e5f7e8;color:#18752a}
.status-cancel{background:#eee;color:#666}

.order-info{padding:10px 13px;font-size:14px;line-height:1.65}
.order-info b{font-weight:800}
.total{font-size:18px;font-weight:900;margin-top:5px}

.items{border-top:1px solid #eee;padding:10px 13px}
.item{padding:8px 0;border-bottom:1px solid #f0f0f0}
.item:last-child{border-bottom:0}
.item-main{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.item-options{font-size:13px;color:#0645d6;margin-top:3px;line-height:1.5}
.cutlery-value{color:#d00000;font-weight:800}
.item-price{white-space:nowrap}

.actions{display:flex;gap:7px;padding:10px 13px;border-top:1px solid #eee}
.action{flex:1;border:0;border-radius:9px;height:40px;font-weight:800}
.primary{background:#111;color:#fff}
.secondary{background:#eee;color:#222}
.danger{background:#ffe4e4;color:#b00000}

.empty{text-align:center;color:#888;padding:50px 20px;background:#fff;border-radius:14px}

.refresh{position:fixed;right:16px;bottom:18px;width:48px;height:48px;border:0;border-radius:50%;background:#111;color:#fff;font-size:20px;box-shadow:0 4px 15px #0003}

@media(max-width:500px){
  .main{padding:10px 9px 80px}
  .stats{gap:6px}
  .stat{padding:9px 5px}
  .stat-num{font-size:19px}
  .brand{font-size:16px}
  .order-head{padding:11px}
  .items,.order-info,.actions{padding-left:11px;padding-right:11px}
}

.pending-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  margin-left:5px;
  border-radius:11px;
  background:#d00000;
  color:#fff;
  font-size:12px;
  font-weight:800;
  line-height:1;
}

.image-admin{background:#fff;border-radius:14px;margin:16px 0;padding:14px;box-shadow:0 2px 8px #00000008}.image-admin h2{margin:0 0 5px;font-size:18px}.image-admin-note{font-size:12px;color:#777;margin-bottom:12px;line-height:1.5}.image-admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.image-admin-field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.image-admin-field select,.image-admin-field input{width:100%;height:42px;border:1px solid #ddd;border-radius:9px;padding:0 10px;background:#fff}.image-admin-preview{margin-top:12px;display:flex;gap:12px;align-items:center;padding:10px;background:#fafafa;border-radius:10px}.image-admin-preview img{width:82px;height:82px;object-fit:cover;border-radius:10px;background:#eee}.image-admin-preview .no-image{width:82px;height:82px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;text-align:center}.image-admin-actions{display:flex;gap:8px;margin-top:12px}.image-admin-actions button{flex:1;height:42px;border:0;border-radius:9px;font-weight:800}.image-upload-btn{background:#111;color:#fff}.image-refresh-btn{background:#eee;color:#222}.image-admin-status{font-size:13px;margin-top:10px;min-height:20px;color:#555}@media(max-width:600px){.image-admin-grid{grid-template-columns:1fr}.image-admin-preview{align-items:flex-start}}
</style>
</head>

<body>

<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <div class="login-title">隔壁宵夜彰化店</div>
    <div class="login-sub">店家後台登入</div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="請輸入店家 Email">
    </div>

    <div class="field">
      <label>密碼</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼">
    </div>

    <button class="login-btn" onclick="login()">登入後台</button>
    <div id="loginError" class="error"></div>

</div>

<div id="app" class="hidden">

  <header class="header">
    <div class="header-inner">
      <div class="brand">隔壁宵夜彰化店｜店家後台</div>
      <button class="logout" onclick="logout()">登出</button>
    </div>
  </header>

  <main class="main">

    <div class="stats">
      <div class="stat">
        <div id="newCount" class="stat-num">0</div>
        <div class="stat-label">待接單</div>
      </div>
      <div class="stat">
        <div id="makingCount" class="stat-num">0</div>

      </div>

        <div class="stat-label">今日完成</div>
      </div>

    <div class="tabs">
      <button class="tab active" data-status="new" onclick="setTab('new',this)">待接單 <span id="pendingCount" class="pending-count">0</span></button>
      <button class="tab" data-status="making" onclick="setTab('making',this)">製作中</button>
      <button class="tab" data-status="done" onclick="setTab('done',this)">已完成</button>
      <button class="tab" data-status="cancelled" onclick="setTab('cancelled',this)">已取消</button>

      <h2>🖼️ 餐點圖片管理</h2>
      <div class="image-admin-note">只在店家後台使用。顧客前台不會看到上傳功能。上傳後會自動取代該餐點目前的圖片。</div>
      <div class="image-admin-grid">
        <div class="image-admin-field"><label for="imageAdminItem">選擇餐點</label><select id="imageAdminItem" onchange="previewAdminImage()"></select></div>
        <div class="image-admin-field"><label for="imageAdminFile">選擇新圖片</label><input id="imageAdminFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewAdminFile()"></div>

    </section>

  </main>

  <button class="refresh" onclick="loadOrders()" title="重新整理">↻</button>
</div>

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const errorBox = document.getElementById("loginError");
  errorBox.textContent = "";

  if(!email || !password){
    errorBox.textContent = "請輸入 Email 與密碼";
    return;
  }

  const {error} = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    errorBox.textContent = "登入失敗：" + error.message;
    return;
  }

  showApp();
}

async function logout(){
  await client.auth.signOut();
  location.reload();
}

function checkSession(){
  const {data, error} = await client.auth.getSession();

  if(error){
    console.error("取得登入狀態失敗：", error);
  }

  if(data && data.session){
    showApp();
  }else{
    showLogin();
  }
}

function showLogin(){
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}

function showApp(){
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  loadOrders();
  startRealtime();
  startAutoRefresh();
  loadAdminImageData();
}

function setTab(status,button){
  currentTab = status;

  document.querySelectorAll(".tab").forEach(x=>{
    x.classList.remove("active");
  });

  button.classList.add("active");

  loadOrders();
}

async function loadOrders(){

  const {data:orders,error} = await client
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    document.getElementById("orders").innerHTML =
      '<div class="empty">讀取訂單失敗<br><small>'+escapeHtml(error.message)+'</small></div>';
    return;
  }

  const today = new Date();
  const todayText = today.toISOString().slice(0,10);

  let newCount = 0;
  let makingCount = 0;
  let doneCount = 0;

  (orders || []).forEach(order=>{
    const status = normalizeStatus(order.status);

    if(status === "new") newCount++;
    if(status === "making") makingCount++;

    if(
      status === "done" &&
      String(order.created_at || "").slice(0,10) === todayText
    ){
      doneCount++;
    }
  });

  document.getElementById("newCount").textContent = newCount;
  const pendingCount = document.getElementById("pendingCount");
  if(pendingCount){
    pendingCount.textContent = newCount;
    pendingCount.style.display = newCount > 0 ? "inline-flex" : "none";
  }
  document.getElementById("makingCount").textContent = makingCount;
  document.getElementById("doneCount").textContent = doneCount;

  const filtered = (orders || []).filter(order=>{
    return normalizeStatus(order.status) === currentTab;
  });

  if(!filtered.length){
    document.getElementById("orders").innerHTML =
      '<div class="empty">目前沒有'+tabName(currentTab)+'訂單</div>';
    return;
  }

  document.getElementById("orders").innerHTML =
    filtered.map(orderCard).join("");

  for(const order of filtered){
    loadItems(order.id);
  }
}

async function loadItems(orderId){

  const {data,error} = await client
    .from("order_items")
    .select("*")
    .eq("order_id",orderId)
    .order("id",{ascending:true});

  const box = document.getElementById("items-"+orderId);

  if(!box) return;

  if(error){
    box.innerHTML = '<div class="item-options">餐點讀取失敗</div>';
    return;
  }

  if(!data || !data.length){
    box.innerHTML = '<div class="item-options">此訂單沒有餐點資料</div>';
    return;
  }

  box.innerHTML = data.map(item=>{

    let options = "";

    if(item.options){

      // 與前台購物車完全相同的細項排序規則：
      // 主餐 → 奶酥 → 炸物 → 加麵/加辣/加起司 → 飲品
      const getOptionRank = (option) => {
        const name = String(option?.name || "");
        const group = String(option?.group || "");

        if(group === "main" || group.includes("主餐")) return 10;
        if(group === "cream" || group.includes("奶酥")) return 20;
        if(group === "fried" || group.includes("炸物")) return 30;
        if(group === "extra" || group.includes("加麵") || group.includes("加辣") || group.includes("加起司")) return 40;
        if(group === "drink" || group.includes("飲品")) return 50;

        if(/加麵|加辣|加起司/.test(name)) return 40;
        if(/紅茶|奶茶|冷泡茶|麥茶|咖啡|可樂|雪碧|飲料|飲品/.test(name)) return 50;

        return 35;
      };

      const formatOptionName = (value) => {
        if(value === null || value === undefined || value === ""){
          return "";
        }

        if(Array.isArray(value)){
          return value.map(formatOptionName).filter(Boolean).join("、");
        }

        if(typeof value === "object"){
          if(value.name !== undefined && value.name !== null && value.name !== ""){
            return formatOptionName(value.name);
          }

          if(value.label !== undefined && value.label !== null && value.label !== ""){
            return formatOptionName(value.label);
          }

          if(value.title !== undefined && value.title !== null && value.title !== ""){
            return formatOptionName(value.title);
          }

          if(value.value !== undefined && value.value !== null && value.value !== ""){
            return formatOptionName(value.value);
          }

          return Object.entries(value)
            .filter(([key]) => !["price","id","key","group"].includes(String(key).toLowerCase()))
            .map(([,val]) => formatOptionName(val))
            .filter(Boolean)
            .join("、");
        }

        return String(value);
      };

      let optionList = [];

      if(Array.isArray(item.options)){
        optionList = item.options.map((option, index) => ({
          option,
          index,
          rank: getOptionRank(option)
        }));
      }else if(typeof item.options === "object"){
        optionList = [{
          option: item.options,
          index: 0,
          rank: getOptionRank(item.options)
        }];
      }else{
        const plain = formatOptionName(item.options);
        if(plain){
          optionList = [{
            option: {name: plain},
            index: 0,
            rank: 35
          }];
        }
      }

      optionList.sort((a,b) => a.rank - b.rank || a.index - b.index);

      options = optionList
        .map(({option}) => formatOptionName(option))
        .filter(Boolean)
        .join("、");
    }

    return `
      <div class="item">
        <div class="item-main">
          <span>${escapeHtml(item.item_name || "未命名品項")} × ${Number(item.quantity || 0)}</span>
          <span class="item-price">$${Number(item.price || 0) * Number(item.quantity || 0)}</span>
        </div>
        ${options ? `<div class="item-options">${escapeHtml(options)}</div>` : ""}
      </div>
    `;
  }).join("");
}

function orderCard(order){

  const status = normalizeStatus(order.status);

  return `
    <div class="order">

      <div class="order-head">
        <div>
          <div class="order-no">訂單 #${escapeHtml(String(order.phone || "").replace(/\D/g, "").slice(-3) || String(order.id))}</div>
          <div class="order-time">
            ${formatDate(order.created_at)}
          </div>
        </div>

        <div class="status ${statusClass(status)}">
          ${statusText(status)}
        </div>
      </div>

      <div class="order-info">

        <div><b>顧客：</b>${escapeHtml(order.customer_name || "—")}</div>

        <div>
          <b>手機：</b>
          <a href="tel:${escapeHtml(order.phone || "")}">
            ${escapeHtml(order.phone || "—")}
          </a>
        </div>

        <div><b>取餐時間：</b>${escapeHtml(order.pickup_time || "不指定")}</div>

        <div><b>餐具：</b><span class="cutlery-value">${escapeHtml(order.cutlery || "—")}</span></div>

        <div class="total">
          $${Number(order.total || 0)}
        </div>

      </div>

      <div class="items" id="items-${order.id}">
        <div class="item-options">載入餐點中…</div>
      </div>

      <div class="actions">

        ${status === "new" ? `
          <button class="action primary" onclick="changeStatus(${order.id},'making')">
            開始製作
          </button>
          <button class="action danger" onclick="changeStatus(${order.id},'cancelled')">
            取消
          </button>
        ` : ""}

        ${status === "making" ? `
          <button class="action primary" onclick="changeStatus(${order.id},'done')">
            餐點完成
          </button>
          <button class="action danger" onclick="changeStatus(${order.id},'cancelled')">
            取消
          </button>
        ` : ""}

        ${status === "done" ? `
          <button class="action secondary" onclick="changeStatus(${order.id},'new')">
            恢復待接單
          </button>
        ` : ""}

        ${status === "cancelled" ? `
          <button class="action secondary" onclick="changeStatus(${order.id},'new')">
            恢復待接單
          </button>
        ` : ""}

      </div>

    </div>
  `;
}

async function changeStatus(id,status){

  const label = statusText(normalizeStatus(status));

  if(!confirm("確定要將此訂單改為「"+label+"」嗎？")){
    return;
  }

  const {error} = await client
    .from("orders")
    .update({status})
    .eq("id",id);

  if(error){
    alert("修改失敗：" + error.message);
    return;
  }

  loadOrders();
}

function startAutoRefresh(){
  // 測試期間：每 30 秒自動重新整理訂單
  setInterval(() => {
    loadOrders();
  }, 30000);
}

function startRealtime(){

  if(realtimeChannel){
    client.removeChannel(realtimeChannel);
  }

  realtimeChannel = client
    .channel("orders-admin")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"orders"
      },
      ()=>{
        loadOrders();
      }
    )
    .subscribe();
}

function normalizeStatus(status){

  const s = String(status || "").toLowerCase();

  if(
    s === "new" ||
    s === "pending" ||
    s === "待接單" ||
    s === "待處理"
  ) return "new";

  if(
    s === "making" ||
    s === "processing" ||
    s === "製作中"
  ) return "making";

  if(
    s === "done" ||
    s === "completed" ||
    s === "完成" ||
    s === "已完成"
  ) return "done";

  if(
    s === "cancelled" ||
    s === "canceled" ||
    s === "取消" ||
    s === "已取消"
  ) return "cancelled";

  return "new";
}

function statusText(status){

  if(status === "new") return "待接單";
  if(status === "making") return "製作中";
  if(status === "done") return "已完成";
  if(status === "cancelled") return "已取消";

  return status;
}

function statusClass(status){

  if(status === "new") return "status-new";
  if(status === "making") return "status-making";
  if(status === "done") return "status-done";
  if(status === "cancelled") return "status-cancel";

  return "";
}

function tabName(status){

  if(status === "new") return "待接單";
  if(status === "making") return "製作中";
  if(status === "done") return "已完成";
  if(status === "cancelled") return "已取消";

  return "";
}

function formatDate(value){

  if(!value) return "—";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) return String(value);

  return d.toLocaleString("zh-TW",{
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key === "Enter") login();
});

client.auth.onAuthStateChange((event,session)=>{
  if(session){
    showApp();
  }
});

checkSession();
</script>
