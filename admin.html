<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>隔壁宵夜彰化店｜店家後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 30px #00000012}
.login-title{text-align:center;font-size:24px;font-weight:800;margin-bottom:6px}
.login-sub{text-align:center;color:#777;font-size:14px;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:46px;border:1px solid #ddd;border-radius:10px;padding:0 13px;outline:none}
.field input:focus{border-color:#111}
.login-btn{width:100%;height:48px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800}
.error{color:#d00;font-size:14px;margin-top:12px;text-align:center}

.header{position:sticky;top:0;z-index:20;background:#111;color:#fff;padding:12px 14px}
.header-inner{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:18px;font-weight:800}
.logout{border:1px solid #555;background:#222;color:#fff;border-radius:8px;padding:7px 10px;font-size:13px}

.main{max-width:900px;margin:auto;padding:14px 12px 40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:12px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:900}
.stat-label{font-size:12px;color:#777;margin-top:3px}

.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:12px}
.tab{flex:0 0 auto;border:1px solid #ddd;background:#fff;border-radius:9px;padding:9px 13px;font-weight:700;font-size:14px}
.tab.active{background:#111;color:#fff;border-color:#111}

.order{background:#fff;border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.order-head{padding:12px 13px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid #eee}
.order-no{font-weight:900;font-size:16px}
.order-time{font-size:13px;color:#777;margin-top:3px}
.status{font-size:12px;font-weight:800;padding:5px 8px;border-radius:7px;white-space:nowrap}
.status-new{background:#ffe7e7;color:#c00}
.status-making{background:#fff1d6;color:#a05a00}
.status-done{background:#e5f7e8;color:#18752a}
.status-cancel{background:#eee;color:#666}

.order-info{padding:10px 13px;font-size:14px;line-height:1.65}
.order-info b{font-weight:800}
.total{font-size:18px;font-weight:900;margin-top:5px}

.items{border-top:1px solid #eee;padding:10px 13px}
.item{padding:8px 0;border-bottom:1px solid #f0f0f0}
.item:last-child{border-bottom:0}
.item-main{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.item-options{font-size:13px;color:#0645d6;margin-top:3px;line-height:1.5}
.cutlery-value{color:#d00000;font-weight:800}
.item-price{white-space:nowrap}

.actions{display:flex;gap:7px;padding:10px 13px;border-top:1px solid #eee}
.action{flex:1;border:0;border-radius:9px;height:40px;font-weight:800}
.primary{background:#111;color:#fff}
.secondary{background:#eee;color:#222}
.danger{background:#ffe4e4;color:#b00000}

.empty{text-align:center;color:#888;padding:50px 20px;background:#fff;border-radius:14px}

.refresh{position:fixed;right:16px;bottom:18px;width:48px;height:48px;border:0;border-radius:50%;background:#111;color:#fff;font-size:20px;box-shadow:0 4px 15px #0003}

@media(max-width:500px){
  .main{padding:10px 9px 80px}
  .stats{gap:6px}
  .stat{padding:9px 5px}
  .stat-num{font-size:19px}
  .brand{font-size:16px}
  .order-head{padding:11px}
  .items,.order-info,.actions{padding-left:11px;padding-right:11px}
}

.pending-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  margin-left:5px;
  border-radius:11px;
  background:#d00000;
  color:#fff;
  font-size:12px;
  font-weight:800;
  line-height:1;
}

.tab-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-left:4px;border-radius:10px;background:#eee;color:#555;font-size:11px;font-weight:900;line-height:1}
.tab.active .tab-count{background:#fff;color:#111}

.image-admin{background:#fff;border-radius:14px;margin:16px 0;padding:14px;box-shadow:0 2px 8px #00000008}.image-admin h2{margin:0 0 5px;font-size:18px}.image-admin-note{font-size:12px;color:#777;margin-bottom:12px;line-height:1.5}.image-admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.image-admin-field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.image-admin-field select,.image-admin-field input{width:100%;height:42px;border:1px solid #ddd;border-radius:9px;padding:0 10px;background:#fff}.image-admin-preview{margin-top:12px;display:flex;gap:12px;align-items:center;padding:10px;background:#fafafa;border-radius:10px}.image-admin-preview img{width:82px;height:82px;object-fit:cover;border-radius:10px;background:#eee}.image-admin-preview .no-image{width:82px;height:82px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;text-align:center}.image-admin-actions{display:flex;gap:8px;margin-top:12px}.image-admin-actions button{flex:1;height:42px;border:0;border-radius:9px;font-weight:800}.image-upload-btn{background:#111;color:#fff}.image-refresh-btn{background:#eee;color:#222}.image-admin-status{font-size:13px;margin-top:10px;min-height:20px;color:#555}@media(max-width:600px){.image-admin-grid{grid-template-columns:1fr}.image-admin-preview{align-items:flex-start}}


/* ===== 完售管理 ===== */
.soldout-admin{background:#fff;border-radius:14px;margin:16px 0;padding:14px;box-shadow:0 2px 8px #00000008}
.soldout-admin h2{margin:0 0 5px;font-size:18px}
.soldout-note{font-size:12px;color:#777;line-height:1.5;margin-bottom:12px}
.soldout-category{border:1px solid #e5e5e5;border-radius:12px;margin:9px 0;overflow:hidden;background:#fff}
.soldout-category-head{display:flex;align-items:center;gap:8px;padding:11px 12px;background:#fafafa}
.soldout-category-toggle{flex:1;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;text-align:left;font-weight:900;padding:0;min-width:0}
.soldout-category-toggle span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soldout-category-count{font-size:12px;color:#777;margin-left:8px;white-space:nowrap}
.soldout-arrow{font-size:12px;transition:transform .2s}
.soldout-category.open .soldout-arrow{transform:rotate(180deg)}
.soldout-category-actions{display:flex;gap:6px;flex:0 0 auto}
.soldout-mini.selected{background:#fff3e8;color:#b84d00;border:1px solid #f0c7a8;font-weight:800}.soldout-mini{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;font-weight:800}
.soldout-mini.danger{background:#ffe7e7;color:#b00000;border-color:#ffd0d0}
.soldout-mini.restore{background:#eaf8ed;color:#18752a;border-color:#cfead4}
.soldout-items{display:none;border-top:1px solid #eee;padding:7px 10px 10px}
.soldout-category.open .soldout-items{display:block}
.soldout-item-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid #f2f2f2}
.soldout-item-row:last-child{border-bottom:0}
.soldout-item-wrap{border-bottom:1px solid #f2f2f2}.soldout-item-wrap:last-child{border-bottom:0}.soldout-detail-toggle{border:1px solid #ddd;background:#fff;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800;white-space:nowrap}.soldout-detail-list{display:none;margin:0 0 7px 28px;padding-left:10px;border-left:2px solid #eee}.soldout-detail-list.open{display:block}.soldout-detail-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed #eee;font-size:13px}.soldout-detail-row:last-child{border-bottom:0}.soldout-detail-row input{width:16px;height:16px;margin:0}.soldout-detail-row span:nth-child(2){flex:1}.soldout-item-wrap>.soldout-item-row{border-bottom:0}.soldout-item-row{border-bottom:0!important}
.soldout-item-row input{width:18px;height:18px;margin:0;flex:0 0 auto}
.soldout-item-name{flex:1;font-size:14px;font-weight:700;min-width:0}
.soldout-badge{font-size:11px;font-weight:900;padding:4px 7px;border-radius:6px;background:#777;color:#fff;white-space:nowrap}
.soldout-badge.available{background:#eaf8ed;color:#18752a}
.soldout-selected-count{font-size:13px;font-weight:800;color:#555;margin-top:12px}.soldout-bottom-actions{display:flex;gap:8px;margin-top:8px}
.soldout-bottom-actions button{flex:1;height:42px;border:0;border-radius:9px;font-weight:900}
.soldout-all-btn{background:#111;color:#fff}
.soldout-restore-btn{background:#eee;color:#222}
.soldout-status{font-size:13px;min-height:20px;margin-top:9px;color:#555}
@media(max-width:600px){
  .soldout-category-head{align-items:flex-start}
  .soldout-category-actions{flex-direction:column}
  .soldout-mini{white-space:nowrap}
}


/* ===== 後台功能入口 / 日曆 ===== */
.header-inner{align-items:center}
.header-tools{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:1;justify-content:flex-end}
.header-tool{border:1px solid #555;background:#222;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.admin-feature-section{display:none}
.admin-feature-section.feature-active{display:block}
.admin-modal{position:fixed;inset:0;z-index:100;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px}
.admin-modal-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:16px;box-shadow:0 15px 50px #0005}
.history-card{width:min(720px,100%)}
.admin-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.admin-modal-head h2{margin:0;font-size:19px}
.modal-close{width:38px;height:38px;border:0;border-radius:50%;background:#eee;font-size:24px;line-height:1}
.modal-note{font-size:12px;color:#777;line-height:1.5;margin:7px 0 12px}
.calendar-toolbar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin:8px 0 10px}
.calendar-toolbar button{height:40px;border:1px solid #ddd;background:#fff;border-radius:9px;font-size:22px}
.calendar-toolbar strong{text-align:center;font-size:16px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calendar-week{font-size:11px;color:#888;text-align:center;padding:4px 0}
.calendar-day{min-height:48px;border:1px solid #eee;background:#fff;border-radius:8px;font-weight:800}
.calendar-day.other{color:#bbb;background:#fafafa}
.calendar-day.today{border-color:#111}
.calendar-day.selected{background:#111;color:#fff;border-color:#111}
.calendar-day.closed{background:#ffe3e3;color:#b00000;border-color:#ffbcbc}
.calendar-day.selected.closed{background:#111;color:#fff;border-color:#111}
.calendar-day.has-orders{box-shadow:inset 0 -3px 0 #d46a00}
.calendar-day:disabled{opacity:.45;cursor:not-allowed}
.modal-status{min-height:22px;font-size:12px;color:#555;margin-top:9px}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions button{flex:1;height:44px;border:0;border-radius:9px;font-weight:900}
.history-result{margin-top:12px}
.history-summary{background:#f8f8f8;border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px;font-weight:800}
.history-order{background:#fff;border:1px solid #eee;border-radius:10px;padding:11px;margin-bottom:8px}
.history-order-head{display:flex;justify-content:space-between;gap:8px;font-weight:900}
.history-order-meta{font-size:12px;color:#666;margin-top:4px;line-height:1.55}
.history-items{margin-top:7px;padding-top:7px;border-top:1px dashed #eee;font-size:12px;line-height:1.6}
@media(max-width:650px){
  .header{padding:8px 9px}
  .header-inner{display:grid;grid-template-columns:1fr;gap:7px}
  .header-tools{justify-content:flex-start;overflow-x:auto}
  .header-tool{padding:7px 9px}
  .logout{position:absolute;right:9px;top:8px}
  .brand{padding-right:52px}
  .calendar-day{min-height:44px;font-size:13px}
}

</style>

<style id="soldout-two-column-layout">
.soldout-category-list{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:10px !important;
  align-items:start;
}
.soldout-category-list > *{
  min-width:0;
}
@media (max-width:420px){
  .soldout-category-list{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:8px !important;
  }
}
</style>


<style id="soldout-detail-summary-style">
.soldout-detail-summary{
  font-size:11px;
  font-weight:800;
  color:#8a5a00;
  white-space:nowrap;
}
</style>


<style id="soldout-two-column-v5">
#soldoutCategories,
.soldout-category-list{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:10px !important;
  align-items:start !important;
}
#soldoutCategories > .soldout-category,
.soldout-category-list > .soldout-category{
  width:100% !important;
  min-width:0 !important;
  margin:0 !important;
}
@media (max-width:480px){
  #soldoutCategories,
  .soldout-category-list{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:8px !important;
  }
}
</style>





<style id="soldout-options-inline-v7">
.soldout-options-inline{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  width:100%;
  padding:8px 10px;
  border-bottom:1px solid #eee;
  background:#fafafa;
  box-sizing:border-box;
}
.soldout-options-inline .soldout-mini{
  flex:0 0 auto;
  min-height:36px;
  padding:7px 13px;
  white-space:nowrap;
}
@media(max-width:520px){
  .soldout-options-inline{
    flex-wrap:wrap;
    gap:7px;
    padding:8px;
  }
  .soldout-options-inline .soldout-mini{
    flex:1 1 calc(25% - 7px);
    min-width:0;
    padding:8px 5px;
    font-size:12px;
  }
}
</style>

</head>

<body>

<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <div class="login-title">隔壁宵夜彰化店</div>
    <div class="login-sub">店家後台登入</div>

    <div class="field">
      <label>Email</label>
      <input id="email" type="email" autocomplete="username" placeholder="請輸入店家 Email">
    </div>

    <div class="field">
      <label>密碼</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="請輸入密碼">
    </div>

    <button class="login-btn" onclick="login()">登入後台</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="app" class="hidden">

  <header class="header">
    <div class="header-inner">
      <div class="brand">隔壁宵夜彰化店｜店家後台</div>
      <div class="header-tools">
        <button class="header-tool" type="button" onclick="openAdminFeature('soldout')">完售管理</button>
        <button class="header-tool" type="button" onclick="openAdminFeature('images')">圖片管理</button>
        <button class="header-tool" type="button" onclick="openClosedDates()">店休</button>
        <button class="header-tool" type="button" onclick="openHistoryCalendar()">歷史訂單</button>
        <button class="logout" onclick="logout()">登出</button>
      </div>
    </div>
  </header>

  <main class="main">

    <div class="stats">
      <div class="stat">
        <div id="newCount" class="stat-num">0</div>
        <div class="stat-label">待接單</div>
      </div>
      <div class="stat">
        <div id="makingCount" class="stat-num">0</div>
        <div class="stat-label">製作中</div>
      </div>
      <div class="stat">
        <div id="doneCount" class="stat-num">0</div>
        <div class="stat-label">今日完成</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-status="new" onclick="setTab('new',this)">待接單</button>
      <button class="tab" data-status="making" onclick="setTab('making',this)">製作中</button>
      <button class="tab" data-status="done" onclick="setTab('done',this)">已完成</button>
      <button class="tab" data-status="cancelled" onclick="setTab('cancelled',this)">已取消</button>
    </div>

    <div id="orders"></div>

    <div id="managementPanel" class="hidden">

    <section class="soldout-admin admin-feature-section" id="soldoutAdminSection">
      <h2>🚫 餐點完售管理</h2>
      <div class="soldout-note">以大項分類管理。點選大項展開後，可複選多個品項，再一次設定「完售」或「恢復供應」。原本單一品項完售狀態仍保留。</div>
      <div id="soldoutCategories"></div>
      
      <div id="soldoutStatus" class="soldout-status"></div>
    </section>

    <section class="image-admin admin-feature-section" id="imageAdminSection">
      <h2>🖼️ 餐點圖片管理</h2>
      <div class="image-admin-note">只在店家後台使用。顧客前台不會看到上傳功能。上傳後會自動取代該餐點目前的圖片。</div>
      <div class="image-admin-grid">
        <div class="image-admin-field"><label for="imageAdminItem">選擇餐點</label><select id="imageAdminItem" onchange="previewAdminImage()"></select></div>
        <div class="image-admin-field"><label for="imageAdminFile">選擇新圖片</label><input id="imageAdminFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewAdminFile()"></div>
      </div>
      <div class="image-admin-preview"><div id="imageAdminPreviewBox" class="no-image">尚無圖片</div><div><b id="imageAdminPreviewName">請選擇餐點</b><div id="imageAdminPreviewPath" class="image-admin-note" style="margin:4px 0 0">—</div></div></div>
      <div class="image-admin-actions"><button class="image-upload-btn" onclick="uploadMenuImage()">上傳／更換圖片</button><button class="image-refresh-btn" onclick="loadAdminImageData()">重新整理</button></div>
      <div id="imageAdminStatus" class="image-admin-status"></div>
    </section>

    </div>

  </main>


    <div id="closedDatesModal" class="admin-modal hidden" aria-hidden="true">
      <div class="admin-modal-card">
        <div class="admin-modal-head">
          <h2>📅 店休管理</h2>
          <button class="modal-close" type="button" onclick="closeAdminModal('closedDatesModal')">×</button>
        </div>
        <div class="modal-note">可一次選擇多個店休日，點日期即可切換。已設定店休會明顯標示。</div>
        <div class="calendar-toolbar">
          <button type="button" onclick="moveCalendarMonth('closed',-1)">‹</button>
          <strong id="closedCalendarTitle"></strong>
          <button type="button" onclick="moveCalendarMonth('closed',1)">›</button>
        </div>
        <div id="closedCalendar" class="calendar-grid"></div>
        <div id="closedDateStatus" class="modal-status"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" onclick="closeAdminModal('closedDatesModal')">取消</button>
          <button type="button" class="primary" onclick="saveClosedDates()">儲存店休</button>
        </div>
      </div>
    </div>

    <div id="historyModal" class="admin-modal hidden" aria-hidden="true">
      <div class="admin-modal-card history-card">
        <div class="admin-modal-head">
          <h2>🗓️ 查詢歷史訂單</h2>
          <button class="modal-close" type="button" onclick="closeAdminModal('historyModal')">×</button>
        </div>
        <div class="modal-note">點選營業日查詢。營業日以 18:00～隔日 01:10 為同一天。</div>
        <div class="calendar-toolbar">
          <button type="button" onclick="moveCalendarMonth('history',-1)">‹</button>
          <strong id="historyCalendarTitle"></strong>
          <button type="button" onclick="moveCalendarMonth('history',1)">›</button>
        </div>
        <div id="historyCalendar" class="calendar-grid"></div>
        <div id="historyResult" class="history-result">
          <div class="empty">請先點選要查詢的營業日</div>
        </div>
      </div>
    </div>

  <button class="refresh" onclick="loadOrders()" title="重新整理">↻</button>
</div>

<script>
const SUPABASE_URL = "https://xoyxtgqamzdxbboxhcdu.supabase.co";

/*
  這裡使用 Supabase anon/publishable key。
  這不是 Service Role Key，不可把 Service Role Key 放在前端。
*/
const SUPABASE_KEY = "sb_publishable_tMYuq4stsYyHJaTuF-LMrg_hUmOXuB5";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {

function soldOutDetailKey(parentKey,detailName){return `${parentKey}::detail::${encodeURIComponent(String(detailName))}`}
function getSoldOutDetails(parentKey){return SOLDOUT_ITEM_DETAILS[parentKey]||[]}
function expandSoldOutKeys(keys){
  const out=new Set();
  (keys||[]).forEach(key=>{
    out.add(key);
    getSoldOutDetails(key).forEach(name=>out.add(soldOutDetailKey(key,name)));
  });
  return [...out];
}


function soldOutKey(groupIndex,itemIndex){
  return groupIndex === 8 ? `hidden-${itemIndex}` : `menu-${groupIndex}-${itemIndex}`;
}
function soldOutStatusText(message){
  const el=document.getElementById('soldoutStatus');
  if(el)el.textContent=message||'';
}
function getDetailNameFromKey(key){
  const marker='::detail::';
  const i=String(key||'').indexOf(marker);
  if(i<0)return null;
  try{return decodeURIComponent(String(key).slice(i+marker.length));}
  catch(e){return String(key).slice(i+marker.length);}
}
function getAllDetailKeysByName(detailName){
  const keys=[];
  Object.keys(SOLDOUT_ITEM_DETAILS).forEach(parentKey=>{
    (SOLDOUT_ITEM_DETAILS[parentKey]||[]).forEach(name=>{
      if(String(name)===String(detailName)) keys.push(soldOutDetailKey(parentKey,name));
    });
  });
  return keys;
}
function normalizeGlobalDetailSoldOut(){
  const names=new Set();
  Object.keys(adminSoldOut).forEach(key=>{
    if(adminSoldOut[key]){
      const name=getDetailNameFromKey(key);
      if(name)names.add(name);
    }
  });
  names.forEach(name=>{
    getAllDetailKeysByName(name).forEach(key=>adminSoldOut[key]=true);
  });
}

function toggleSoldOutDetails(key){

}
function toggleSoldOutGroup(gi){
  const el=document.getElementById(`soldout-group-${gi}`);
  if(!el)return;
  const willOpen=!el.classList.contains('open');

  // 只允許一個大項同時展開
  soldOutOpenGroups.clear();
  document.querySelectorAll('.soldout-category.open').forEach(node=>{

function getSelectedSoldOutKeys(){

async function setSelectedSoldOut(value){
  const selected=getSelectedSoldOutKeys();
  if(!selected.length){alert('請先勾選要處理的品項。');return}
  const keys=expandSoldOutKeys(selected);
  if(!confirm(`確定要將選取的 ${selected.length} 個品項及其相關細項${value?'設為完售':'恢復供應'}嗎？`))return;
  await saveSoldOutKeys(keys,value);
}
async function setSoldOutGroup(gi,value){
  const parentKeys=SOLDOUT_MENU_GROUPS[gi][1].map((_,ii)=>soldOutKey(gi,ii));
  const keys=expandSoldOutKeys(parentKeys);
  if(!confirm(`確定要將「${SOLDOUT_MENU_GROUPS[gi][0]}」的餐點與所有相關細項${value?'全部設為完售':'全部恢復供應'}嗎？`))return;
  await saveSoldOutKeys(keys,value);
}
async function saveSoldOutKeys(keys,value){
  soldOutStatusText('正在更新完售狀態…');
  const expanded=new Set();
  (keys||[]).forEach(key=>{
    expanded.add(key);
    const detailName=getDetailNameFromKey(key);
    if(detailName){
      // 細項是共用原料／選項：同名細項全部同步完售或恢復。
      getAllDetailKeysByName(detailName).forEach(k=>expanded.add(k));
    }
  });
  const finalKeys=[...expanded];
  const rows=finalKeys.map(key=>({item_key:key,sold_out:!!value,updated_at:new Date().toISOString()}));
  const {error}=await client.from('menu_item_status').upsert(rows,{onConflict:'item_key'});
  if(error){soldOutStatusText('更新失敗：'+error.message);alert('完售狀態更新失敗：'+error.message);return}
  finalKeys.forEach(key=>adminSoldOut[key]=!!value);
  normalizeGlobalDetailSoldOut();
  renderSoldOutAdmin();
  soldOutStatusText(`已更新 ${finalKeys.length} 個相關項目：${value?'完售':'恢復供應'}`);
}

    .subscribe();
}

  if(panel) panel.classList.add("hidden");
}
function openAdminFeature(feature){
  const panel=document.getElementById("managementPanel");
  const orders=document.getElementById("orders");
  if(!panel || !orders)return;
  orders.style.display="none";
  panel.classList.remove("hidden");

  if(target) target.classList.add("feature-active");

function toggleManagement(){
  openAdminFeature("soldout");
}
function setTab(status,button){
  currentTab=status;
  const panel=document.getElementById("managementPanel");
  const orders=document.getElementById("orders");
  if(panel) panel.classList.add("hidden");
  if(orders) orders.style.display="block";
  document.querySelectorAll(".admin-feature-section").forEach(x=>x.classList.remove("feature-active"));
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  if(button) button.classList.add("active");

async function loadOrders(){
  const businessDate = getBusinessDate(new Date());

  const {data:orders,error} = await client
    .from("orders")
    .select("*")
    .eq("business_date",businessDate)
    .eq("is_archived",false)
    .order("created_at",{ascending:false})
    .limit(100);

  if(error){
    document.getElementById("orders").innerHTML =
      '<div class="empty">讀取訂單失敗<br><small>'+escapeHtml(error.message)+'</small></div>';
    return;
  }

  let newCount=0,makingCount=0,doneCount=0,cancelledCount=0;
  (orders||[]).forEach(order=>{
    const status=normalizeStatus(order.status);
    if(status==="new")newCount++;
    if(status==="making")makingCount++;
    if(status==="done")doneCount++;
    if(status==="cancelled")cancelledCount++;
  });

  document.getElementById("newCount").textContent=newCount;
  document.getElementById("makingCount").textContent=makingCount;
  document.getElementById("doneCount").textContent=doneCount;

  const filtered=(orders||[]).filter(order=>normalizeStatus(order.status)===currentTab);
  if(!filtered.length){
    document.getElementById("orders").innerHTML='<div class="empty">目前沒有'+tabName(currentTab)+'訂單</div>';
    return;
  }
  document.getElementById("orders").innerHTML=filtered.map(orderCard).join("");
  for(const order of filtered)loadItems(order.id);
}

function getBusinessDate(date){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(date);
  const map={};parts.forEach(p=>map[p.type]=p.value);
  let y=Number(map.year),m=Number(map.month),d=Number(map.day);
  const hour=Number(map.hour), minute=Number(map.minute);
  if(hour<1 || (hour===1 && minute<10)){ // 01:10前均屬前一營業日
    const utc=new Date(Date.UTC(y,m-1,d));
    utc.setUTCDate(utc.getUTCDate()-1);
    y=utc.getUTCFullYear();m=utc.getUTCMonth()+1;d=utc.getUTCDate();
  }
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
async function loadItems(orderId){

  const {data,error} = await client
    .from("order_items")
    .select("*")
    .eq("order_id",orderId)
    .order("id",{ascending:true});

  const box = document.getElementById("items-"+orderId);

  if(!box) return;

  if(error){
    box.innerHTML = '<div class="item-options">餐點讀取失敗</div>';
    return;
  }

  if(!data || !data.length){
    box.innerHTML = '<div class="item-options">此訂單沒有餐點資料</div>';
    return;
  }

  box.innerHTML = data.map(item=>{

    let options = "";

    if(item.options){

      // 與前台購物車完全相同的細項排序規則：
      // 主餐 → 奶酥 → 炸物 → 加麵/加辣/加起司 → 飲品
      const getOptionRank = (option) => {
        const name = String(option?.name || "");
        const group = String(option?.group || "");

        if(group === "main" || group.includes("主餐")) return 10;
        if(group === "cream" || group.includes("奶酥")) return 20;
        if(group === "fried" || group.includes("炸物")) return 30;
        if(group === "extra" || group.includes("加麵") || group.includes("加辣") || group.includes("加起司")) return 40;
        if(group === "drink" || group.includes("飲品")) return 50;

        if(/加麵|加辣|加起司/.test(name)) return 40;
        if(/紅茶|奶茶|冷泡茶|麥茶|咖啡|可樂|雪碧|飲料|飲品/.test(name)) return 50;

        return 35;
      };

      const formatOptionName = (value) => {
        if(value === null || value === undefined || value === ""){
          return "";
        }

        if(Array.isArray(value)){
          return value.map(formatOptionName).filter(Boolean).join("、");
        }

        if(typeof value === "object"){
          if(value.name !== undefined && value.name !== null && value.name !== ""){
            return formatOptionName(value.name);
          }

          if(value.label !== undefined && value.label !== null && value.label !== ""){
            return formatOptionName(value.label);
          }

          if(value.title !== undefined && value.title !== null && value.title !== ""){
            return formatOptionName(value.title);
          }

          if(value.value !== undefined && value.value !== null && value.value !== ""){
            return formatOptionName(value.value);
          }

          return Object.entries(value)
            .filter(([key]) => !["price","id","key","group"].includes(String(key).toLowerCase()))
            .map(([,val]) => formatOptionName(val))
            .filter(Boolean)
            .join("、");
        }

        return String(value);
      };

      let optionList = [];

      if(Array.isArray(item.options)){
        optionList = item.options.map((option, index) => ({
          option,
          index,
          rank: getOptionRank(option)
        }));
      }else if(typeof item.options === "object"){
        optionList = [{
          option: item.options,
          index: 0,
          rank: getOptionRank(item.options)
        }];
      }else{
        const plain = formatOptionName(item.options);
        if(plain){
          optionList = [{
            option: {name: plain},
            index: 0,
            rank: 35
          }];
        }
      }

      optionList.sort((a,b) => a.rank - b.rank || a.index - b.index);

      options = optionList
        .map(({option}) => formatOptionName(option))
        .filter(Boolean)
        .join("、");
    }

    return `
      <div class="item">
        <div class="item-main">
          <span>${escapeHtml(item.item_name || "未命名品項")} × ${Number(item.quantity || 0)}</span>
          <span class="item-price">$${Number(item.price || 0) * Number(item.quantity || 0)}</span>
        </div>
        ${options ? `<div class="item-options">${escapeHtml(options)}</div>` : ""}
      </div>
    `;
  }).join("");
}

function orderCard(order){

  const status = normalizeStatus(order.status);

  return `
    <div class="order">

      <div class="order-head">
        <div>
          <div class="order-no">訂單 #${escapeHtml(String(order.phone || "").replace(/\D/g, "").slice(-3) || String(order.id))}</div>
          <div class="order-time">
            ${formatDate(order.created_at)}
          </div>
        </div>

        <div class="status ${statusClass(status)}">
          ${statusText(status)}
        </div>
      </div>

      <div class="order-info">

        <div><b>顧客：</b>${escapeHtml(order.customer_name || "—")}</div>

        <div>
          <b>手機：</b>
          <a href="tel:${escapeHtml(order.phone || "")}">
            ${escapeHtml(order.phone || "—")}
          </a>
        </div>

        <div><b>取餐時間：</b>${escapeHtml(order.pickup_time || "不指定")}</div>

        <div><b>餐具：</b><span class="cutlery-value">${escapeHtml(order.cutlery || "—")}</span></div>

        <div class="total">
          $${Number(order.total || 0)}
        </div>

      </div>

      <div class="items" id="items-${order.id}">
        <div class="item-options">載入餐點中…</div>
      </div>

      <div class="actions">

        ${status === "new" ? `
          <button class="action primary" onclick="changeStatus(${order.id},'making')">
            開始製作
          </button>
          <button class="action danger" onclick="changeStatus(${order.id},'cancelled')">
            取消
          </button>
        ` : ""}

        ${status === "making" ? `
          <button class="action primary" onclick="changeStatus(${order.id},'done')">
            餐點完成
          </button>
          <button class="action danger" onclick="changeStatus(${order.id},'cancelled')">
            取消
          </button>
        ` : ""}

        ${status === "done" ? `
          <button class="action secondary" onclick="changeStatus(${order.id},'new')">
            恢復待接單
          </button>
        ` : ""}

        ${status === "cancelled" ? `
          <button class="action secondary" onclick="changeStatus(${order.id},'new')">
            恢復待接單
          </button>
        ` : ""}

      </div>

    </div>
  `;
}


let closedCalendarCursor=new Date();
let historyCalendarCursor=new Date();
let closedDatesExisting=new Set();
let closedDatesDraft=new Set();

function closeAdminModal(id){
  const el=document.getElementById(id);
  if(el){el.classList.add("hidden");el.setAttribute("aria-hidden","true");}
}
function openModal(id){
  const el=document.getElementById(id);
  if(el){el.classList.remove("hidden");el.setAttribute("aria-hidden","false");}
}
function fmtDateKey(y,m,d){
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function monthKey(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
}
function moveCalendarMonth(type,delta){
  const c=type==="closed"?closedCalendarCursor:historyCalendarCursor;
  c.setMonth(c.getMonth()+delta,1);
  if(type==="closed")renderClosedCalendar();else renderHistoryCalendar();
}
async function openClosedDates(){
  openModal("closedDatesModal");
  closedCalendarCursor=new Date();
  closedCalendarCursor.setDate(1);
  const {data,error}=await client.from("shop_closed_dates").select("closed_date").order("closed_date");
  if(error){
    document.getElementById("closedDateStatus").textContent="讀取店休日失敗："+error.message;
    return;
  }
  closedDatesExisting=new Set((data||[]).map(r=>String(r.closed_date)));
  closedDatesDraft=new Set(closedDatesExisting);
  renderClosedCalendar();
}
function renderClosedCalendar(){
  const y=closedCalendarCursor.getFullYear(),m=closedCalendarCursor.getMonth();
  document.getElementById("closedCalendarTitle").textContent=`${y} 年 ${m+1} 月`;
  const root=document.getElementById("closedCalendar");
  const labels=["日","一","二","三","四","五","六"];
  let out=labels.map(x=>`<div class="calendar-week">${x}</div>`).join("");
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  for(let i=0;i<first;i++){
    out+=`<button type="button" class="calendar-day other" disabled>${prevDays-first+i+1}</button>`;
  }
  const todayKey=getTaipeiDateKey(new Date());
  for(let d=1;d<=days;d++){
    const key=fmtDateKey(y,m+1,d);
    const cls=["calendar-day"];
    if(key===todayKey)cls.push("today");
    if(closedDatesExisting.has(key))cls.push("closed");
    if(closedDatesDraft.has(key))cls.push("selected");
    out+=`<button type="button" class="${cls.join(" ")}" onclick="toggleClosedDate('${key}')">${d}</button>`;
  }
  const total=first+days;
  for(let i=total;i<42;i++)out+=`<button type="button" class="calendar-day other" disabled>${i-total+1}</button>`;
  root.innerHTML=out;
  document.getElementById("closedDateStatus").textContent=`已選 ${closedDatesDraft.size} 天店休`;
}
function toggleClosedDate(key){
  if(closedDatesDraft.has(key))closedDatesDraft.delete(key);else closedDatesDraft.add(key);
  renderClosedCalendar();
}
async function saveClosedDates(){
  const add=[...closedDatesDraft].filter(x=>!closedDatesExisting.has(x));
  const del=[...closedDatesExisting].filter(x=>!closedDatesDraft.has(x));
  if(add.length){
    const {error}=await client.from("shop_closed_dates").upsert(add.map(closed_date=>({closed_date})),{onConflict:"closed_date"});
    if(error){document.getElementById("closedDateStatus").textContent="儲存失敗："+error.message;return;}
  }
  if(del.length){
    const {error}=await client.from("shop_closed_dates").delete().in("closed_date",del);
    if(error){document.getElementById("closedDateStatus").textContent="取消店休失敗："+error.message;return;}
  }
  closedDatesExisting=new Set(closedDatesDraft);
  document.getElementById("closedDateStatus").textContent="店休日期已更新";
  renderClosedCalendar();
}

function getTaipeiDateKey(date){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const map={};parts.forEach(p=>map[p.type]=p.value);
  return `${map.year}-${map.month}-${map.day}`;
}
async function openHistoryCalendar(){
  openModal("historyModal");
  historyCalendarCursor=new Date();
  historyCalendarCursor.setDate(1);
  await renderHistoryCalendar();
}
async function renderHistoryCalendar(){
  const y=historyCalendarCursor.getFullYear(),m=historyCalendarCursor.getMonth();
  document.getElementById("historyCalendarTitle").textContent=`${y} 年 ${m+1} 月`;
  const root=document.getElementById("historyCalendar");
  const labels=["日","一","二","三","四","五","六"];
  let out=labels.map(x=>`<div class="calendar-week">${x}</div>`).join("");
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  for(let i=0;i<first;i++)out+=`<button type="button" class="calendar-day other" disabled>${prevDays-first+i+1}</button>`;
  const start=fmtDateKey(y,m+1,1),end=fmtDateKey(y,m+1,days);
  const {data,error}=await client.from("orders").select("business_date").gte("business_date",start).lte("business_date",end);
  const counts={};(data||[]).forEach(r=>counts[r.business_date]=(counts[r.business_date]||0)+1);
  for(let d=1;d<=days;d++){
    const key=fmtDateKey(y,m+1,d),cls=["calendar-day"];
    if(key===getTaipeiDateKey(new Date()))cls.push("today");
    if(counts[key])cls.push("has-orders");
    out+=`<button type="button" class="${cls.join(" ")}" onclick="queryHistoryOrders('${key}')">${d}</button>`;
  }
  const total=first+days;
  for(let i=total;i<42;i++)out+=`<button type="button" class="calendar-day other" disabled>${i-total+1}</button>`;
  root.innerHTML=out;
}
async function queryHistoryOrders(businessDate){
  const box=document.getElementById("historyResult");
  box.innerHTML='<div class="empty">讀取中…</div>';
  const {data:orders,error}=await client.from("orders").select("*").eq("business_date",businessDate).order("created_at",{ascending:true});
  if(error){box.innerHTML='<div class="empty">查詢失敗<br><small>'+escapeHtml(error.message)+'</small></div>';return;}
  if(!orders?.length){box.innerHTML='<div class="empty">'+businessDate+' 沒有訂單</div>';return;}
  let html=`<div class="history-summary">${businessDate} 營業日｜共 ${orders.length} 筆訂單</div>`;
  for(const o of orders){
    const {data:items}=await client.from("order_items").select("item_name,quantity,price,options").eq("order_id",o.id).order("id");
    const itemText=(items||[]).map(it=>`${escapeHtml(it.item_name)} ×${it.quantity}`).join("、");
    html+=`<div class="history-order">
      <div class="history-order-head"><span>訂單 #${escapeHtml(o.id)}</span><span>${escapeHtml(statusText(normalizeStatus(o.status)))}</span></div>
      <div class="history-order-meta">建立：${escapeHtml(formatDate(o.created_at))}<br>顧客：${escapeHtml(o.customer_name||"—")}｜電話：${escapeHtml(o.phone||"—")}<br>取餐：${escapeHtml(o.pickup_time||"完成後通知")}｜金額：$${escapeHtml(o.total??0)}${o.is_archived?"｜已歸檔":""}</div>
      <div class="history-items">${itemText||"無餐點資料"}</div>
    </div>`;
  }
  box.innerHTML=html;
}

async function changeStatus(id,status){

  const label = statusText(normalizeStatus(status));

  if(!confirm("確定要將此訂單改為「"+label+"」嗎？")){
    return;
  }

  const {error} = await client
    .from("orders")
    .update({status})
    .eq("id",id);

  if(error){
    alert("修改失敗：" + error.message);
    return;
  }

  loadOrders();
}

function startAutoRefresh(){
  // 測試期間：每 30 秒自動重新整理訂單
  setInterval(() => {
    loadOrders();
  }, 30000);
}

function startRealtime(){

  if(realtimeChannel){
    client.removeChannel(realtimeChannel);
  }

  realtimeChannel = client
    .channel("orders-admin")
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"orders"
      },
      ()=>{
        loadOrders();
      }
    )
    .subscribe();
}

function normalizeStatus(status){

  const s = String(status || "").toLowerCase();

  if(
    s === "new" ||
    s === "pending" ||
    s === "待接單" ||
    s === "待處理"
  ) return "new";

  if(
    s === "making" ||
    s === "processing" ||
    s === "製作中"
  ) return "making";

  if(
    s === "done" ||
    s === "completed" ||
    s === "完成" ||
    s === "已完成"
  ) return "done";

  if(
    s === "cancelled" ||
    s === "canceled" ||
    s === "取消" ||
    s === "已取消"
  ) return "cancelled";

  return "new";
}

function statusText(status){

  if(status === "new") return "待接單";
  if(status === "making") return "製作中";
  if(status === "done") return "已完成";
  if(status === "cancelled") return "已取消";

  return status;
}

function statusClass(status){

  if(status === "new") return "status-new";
  if(status === "making") return "status-making";
  if(status === "done") return "status-done";
  if(status === "cancelled") return "status-cancel";

  return "";
}

function tabName(status){

  if(status === "new") return "待接單";
  if(status === "making") return "製作中";
  if(status === "done") return "已完成";
  if(status === "cancelled") return "已取消";

  return "";
}

function formatDate(value){

  if(!value) return "—";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())) return String(value);

  return d.toLocaleString("zh-TW",{
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
