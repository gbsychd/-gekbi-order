<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>隔壁宵夜彰化店｜後台管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.top{background:#111;color:#fff;border-radius:18px;padding:22px;margin-bottom:16px}.top h1{margin:0;font-size:24px}.top p{margin:7px 0 0;color:#ccc}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.07)}label{display:block;font-weight:800;margin:12px 0 7px}select,input[type=file]{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;background:#fff;font-size:16px}button{border:0;border-radius:11px;padding:13px 16px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:#d35400;color:#fff;width:100%;margin-top:14px}.dark{background:#111;color:#fff}.light{background:#eee;color:#333}.row{display:flex;gap:10px}.row button{flex:1}.status{margin-top:12px;padding:11px;border-radius:10px;background:#f7f7f7;color:#666;line-height:1.5}.preview{margin-top:15px;min-height:180px;border:1px dashed #ccc;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fafafa}.preview img{display:block;max-width:100%;max-height:300px;object-fit:contain}.empty{color:#999}.hidden{display:none}.small{font-size:13px;color:#777;line-height:1.5}.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.user{font-size:13px;color:#666;word-break:break-all}.danger{color:#a00}.ok{color:#217a35}.section-title{font-size:20px;font-weight:900;margin:0 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="header-row"><div><h1>隔壁宵夜彰化店｜後台管理</h1><p>餐點圖片管理</p></div><button id="logoutBtn" class="light hidden" onclick="logout()">登出</button></div></div>

  <section id="loginCard" class="card">
    <div class="section-title">店家管理員登入</div>
    <div class="small">使用店家管理 Email 寄送登入連結。一般顧客不會看到這個後台。</div>
    <button class="dark" style="width:100%;margin-top:15px" onclick="sendAdminLogin()">寄送登入連結</button>
    <div id="loginStatus" class="status"></div>
  </section>

  <section id="adminCard" class="card hidden">
    <div class="section-title">🖼️ 餐點圖片管理</div>
    <div id="userInfo" class="user"></div>
    <label for="itemSelect">選擇要管理的餐點</label>
    <select id="itemSelect" onchange="loadPreview()"></select>
    <div class="preview" id="preview"><div class="empty">尚未選擇圖片</div></div>
    <label for="imageFile">選擇新圖片</label>
    <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewSelectedFile()">
    <div class="small">支援 JPG、PNG、WebP；單張圖片最大 5MB。</div>
    <button class="primary" onclick="uploadImage()">上傳／更換圖片</button>
    <div id="status" class="status"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xoyxtgqamzdxbboxhcdu.supabase.co";
const SUPABASE_KEY="sb_publishable_tMYuq4stsYyHJaTuF-LMrg_hUmOXuB5";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="smile510352@gmail.com";
const MENU_IMAGE_BUCKET="menu-images";

const menus=[
  ["隔壁奶酥",[["經典原味厚奶酥",60],["日式抹茶厚奶酥",60],["可可朗尼厚奶酥",60],["香濃花生厚奶酥",60],["經典芝麻厚奶酥",60],["香蒜厚片",50]]],
  ["經典吐司",[["起司蛋吐司",45],["火腿蛋吐司",50],["培根蛋吐司",55],["鮪魚蛋吐司",55],["薯餅蛋吐司",60],["豬排蛋吐司",60],["咔啦雞排蛋吐司",65],["熱狗捲",35],["果醬吐司",25]]],
  ["美味蛋餅",[["原味蛋餅",35],["起司蛋餅",40],["火腿蛋餅",45],["熱狗蛋餅",50],["培根蛋餅",50],["鮪魚蛋餅",50],["薯餅蛋餅",55],["豬排蛋餅",55],["咔啦雞排蛋餅",60],["可可脆脆蛋餅",65]]],
  ["個人特餐-附紅茶",[["豬排黑胡椒麵",100],["豬排蘑菇麵",100],["豬排炒泡麵",105]]],
  ["招牌麵食（乾）",[["古早味紅蔥雞絲麵",50],["古早味剝椒雞絲麵",60],["招牌炒泡麵",80],["沙茶炒泡麵",85],["招牌麻辣炒泡麵",85],["香辣炒泡麵",95],["豬排拌拌麵（大）",90]]],
  ["秘製鍋燒(湯)",[["原味鍋燒",95],["沙茶鍋燒",105],["麻辣鍋燒",105],["咖哩鍋燒",115],["起司牛奶鍋燒",125],["泰式冬陰鍋燒",130]]],
  ["點心炸物",[["荷包蛋",20],["單點豬排",30],["熱狗",30],["薯餅",30],["小肉豆",35],["甜不辣",40],["炸湯圓",40],["薯條",40],["玉米布丁酥",40],["小雞球",45],["麥香雞塊",45],["咔啦雞排（辣）",45],["酥炸杏鮑菇",45],["雙色地瓜QQ球",45],["芋泥球",45],["魷米花",50],["土魠魚塊（炸）",55],["炸元寶",65],["日式炸豬排",70]]],
  ["飲品",[["紅茶",25],["麥茶",25],["奶茶",35],["冷泡茶",45]]]
];
const hiddenMenus=[["豬排大套餐",190],["單人獨享餐",125],["單人經濟套餐",135],["日式炸豬排烏龍麵",135]];
const items=[];
menus.forEach((m,mi)=>m[1].forEach((it,ii)=>items.push({key:`menu-${mi}-${ii}`,name:`${m[0]}｜${it[0]}`})));
hiddenMenus.forEach((it,i)=>items.push({key:`hidden-${i}`,name:`隱藏版菜單｜${it[0]}`}));

const itemSelect=document.getElementById('itemSelect');
itemSelect.innerHTML=items.map(i=>`<option value="${i.key}">${escapeHtml(i.name)}</option>`).join('');
function escapeHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function setStatus(msg,cls=''){const el=document.getElementById('status');el.className='status '+cls;el.textContent=msg||''}
function setLoginStatus(msg){document.getElementById('loginStatus').textContent=msg||''}
function showLoggedIn(user){document.getElementById('loginCard').classList.add('hidden');document.getElementById('adminCard').classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden');document.getElementById('userInfo').textContent='已登入：'+(user.email||'');loadPreview()}
async function checkSession(){const {data:{user}}=await supabaseClient.auth.getUser();if(user?.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase())showLoggedIn(user)}
async function sendAdminLogin(){setLoginStatus('正在寄送登入連結…');const {error}=await supabaseClient.auth.signInWithOtp({email:ADMIN_EMAIL});setLoginStatus(error?'寄送失敗：'+error.message:'登入連結已寄到店家 Email，請點信件中的連結後回到此頁面。')}
async function logout(){await supabaseClient.auth.signOut();location.reload()}
async function loadPreview(){
 const key=itemSelect.value;setStatus('正在讀取目前圖片…');
 const {data,error}=await supabaseClient.from('menu_item_images').select('image_path').eq('item_key',key).maybeSingle();
 const box=document.getElementById('preview');
 if(error){box.innerHTML='<div class="empty">讀取失敗</div>';setStatus('讀取圖片資料失敗：'+error.message,'danger');return}
 if(!data?.image_path){box.innerHTML='<div class="empty">此餐點目前沒有店家自訂圖片</div>';setStatus('目前沒有自訂圖片。上傳後前台會優先使用新圖片。');return}
 const {data:urlData}=supabaseClient.storage.from(MENU_IMAGE_BUCKET).getPublicUrl(data.image_path);
 box.innerHTML=urlData?.publicUrl?`<img src="${urlData.publicUrl}" alt="目前餐點圖片">`:'<div class="empty">圖片網址取得失敗</div>';
 setStatus('目前已有店家圖片。');
}
function previewSelectedFile(){const file=document.getElementById('imageFile').files?.[0];if(!file)return;const box=document.getElementById('preview');if(!['image/jpeg','image/png','image/webp'].includes(file.type)){setStatus('僅支援 JPG、PNG 或 WebP。','danger');return}if(file.size>5*1024*1024){setStatus('圖片不可超過 5MB。','danger');return}box.innerHTML='';const img=document.createElement('img');img.src=URL.createObjectURL(file);box.appendChild(img);setStatus('已選擇新圖片，按「上傳／更換圖片」即可。')}
async function uploadImage(){
 const file=document.getElementById('imageFile').files?.[0];const itemKey=itemSelect.value;if(!file){setStatus('請先選擇一張圖片。','danger');return}
 if(file.size>5*1024*1024){setStatus('圖片不可超過 5MB。','danger');return}
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)){setStatus('僅支援 JPG、PNG 或 WebP。','danger');return}
 setStatus('正在確認管理員權限…');const {data:{user}}=await supabaseClient.auth.getUser();if(user?.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){setStatus('目前不是店家管理帳號，請重新登入。','danger');return}
 setStatus('正在上傳圖片…');const ext=file.name.split('.').pop().toLowerCase();const path=`menu/${itemKey}-${Date.now()}.${ext}`;
 const {data:oldRow}=await supabaseClient.from('menu_item_images').select('image_path').eq('item_key',itemKey).maybeSingle();
 const {error:uploadError}=await supabaseClient.storage.from(MENU_IMAGE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});
 if(uploadError){setStatus('上傳失敗：'+uploadError.message,'danger');return}
 const {error:saveError}=await supabaseClient.from('menu_item_images').upsert({item_key:itemKey,image_path:path,updated_at:new Date().toISOString()});
 if(saveError){await supabaseClient.storage.from(MENU_IMAGE_BUCKET).remove([path]);setStatus('資料儲存失敗：'+saveError.message,'danger');return}
 if(oldRow?.image_path)await supabaseClient.storage.from(MENU_IMAGE_BUCKET).remove([oldRow.image_path]);
 document.getElementById('imageFile').value='';await loadPreview();setStatus('圖片已更新完成。前台重新整理後會優先顯示這張圖片。','ok')
}
supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session?.user?.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase())showLoggedIn(session.user)});
checkSession();
</script>
</body>
</html>
